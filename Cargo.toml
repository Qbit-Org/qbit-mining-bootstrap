[workspace]
resolver = "2"
members = [
    "crates/qbit-pool-builder",
    "crates/qbit-prism",
    "crates/qbit-prism-dual-sim",
    "crates/qbit-prism-load",
    "crates/qbit-prism-server",
    "crates/qbit-prism-test-gate",
]

[workspace.package]
version = "3.1.1"
# Pinned to the toolchain in rust-toolchain.toml; scripts/check_toolchain_pin.py
# fails when they differ.
rust-version = "1.98.1"

[profile.release]
lto = "thin"
codegen-units = 1

# sqlx-core 0.8.6 with launchbadge/sqlx#4251's TLS readiness fix (#771) and
# #3861's verify-ca fix (#713) backported, plus a local verify-ca change (it
# trusts only sslrootcert); vendor/sqlx-core/README.md says what changed and
# when to drop it.
# crates/qbit-prism-server/fuzz/Cargo.toml carries the same patch.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }
