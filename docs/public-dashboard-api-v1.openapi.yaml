openapi: 3.1.0
info:
  title: PRISM Public Dashboard API
  version: 1.0.0
  description: >
    Public, read-only API contract implemented by the PRISM pool software and
    consumed by dashboard clients. These endpoints expose dashboard-ready pool,
    network, block, leaderboard, and miner status data without exposing internal
    audit or operator control surfaces.
servers:
  - url: /public/v1
tags:
  - name: dashboard
    description: Public dashboard read models.
paths:
  /pool-summary:
    get:
      tags: [dashboard]
      operationId: getPoolSummary
      summary: Get current pool and network summary cards.
      responses:
        "200":
          description: Current public pool summary.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolSummaryResponse"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /hashrate-series:
    get:
      tags: [dashboard]
      operationId: getHashrateSeries
      summary: Get chart-ready pool or miner credited hashrate time series.
      description: >
        Every rate is credited hashrate, derived from the accepted share
        difficulty the pool credited to the subject in each bucket. It is not
        physical router telemetry: while the assigned share target and the
        router's own share filtering disagree, neither the raw nor the smoothed
        series reproduces what the router reports. Buckets with no credited
        shares are omitted; consumers synthesize gaps.
      parameters:
        - name: subject
          in: query
          description: Use `pool` or `miner:{recipient_id}`.
          required: false
          schema:
            type: string
            default: pool
            examples: [pool, "miner:qbrt1example"]
        - name: range
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/HashrateRange"
            default: 1m
        - name: bucket
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/HashrateBucket"
            default: auto
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [both]
          description: >
            Omit for the `prism.dashboard.hashrate-series.v1` response, whose
            `hashrate_ths` is the smoothed credited rate. `both` returns
            `prism.dashboard.hashrate-series.v2` carrying the raw and the
            smoothed credited rate for every bucket. Any other non-empty value
            is rejected with `400 bad_request`. The view is part of the cache
            key, so the two responses never share a cache entry. `bucket=auto`
            resolves to 1h for 1w/1m and 1d for 6m/all; with the default 30m
            smoothing window those coarse series have `method=none`. Request
            `bucket=5m` to compare raw buckets with the 30m trailing rate.
      responses:
        "200":
          description: >
            Hashrate series. `prism.dashboard.hashrate-series.v1` without
            `view`; `prism.dashboard.hashrate-series.v2` for `view=both`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HashrateSeriesResponse"
                  - $ref: "#/components/schemas/HashrateSeriesDualRateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /leaderboard:
    get:
      tags: [dashboard]
      operationId: getLeaderboard
      summary: Get ranked pool contributors for a reward/hashrate window.
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [3h, reward]
            default: 3h
          description: >
            `3h` preserves the legacy three-hour hashrate leaderboard. `reward`
            ranks the canonical live PRISM work window using counted share
            difficulty from the latest 8x permissionless-difficulty window.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: Case-insensitive recipient substring. Not valid with `recipient_id`.
        - name: recipient_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >
            Exact recipient lookup for `window=reward`. Ranking and totals remain
            global. Rejected for `window=3h` and not valid with `search`.
      responses:
        "200":
          description: Contributor leaderboard.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LeaderboardResponse"
                  - $ref: "#/components/schemas/RewardLeaderboardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /blocks:
    get:
      tags: [dashboard]
      operationId: getBlocks
      summary: Get recent pool blocks.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: chain_state
          in: query
          required: false
          schema:
            type: string
            enum: [active, all, reversed]
            default: active
          description: >
            Omit or pass `active` for the `prism.dashboard.blocks.v1` response,
            which hides reorged-out blocks exactly as before this parameter
            existed. `all` includes every recorded pool block and `reversed`
            returns only blocks the pool once landed that a chain
            reorganization later disconnected; both return
            `prism.dashboard.blocks.v2` rows carrying `chain_state` and
            `disconnected_at`. Pagination `total_count`/`total_pages` always
            describe the filtered set. Any other value is rejected with
            `400 bad_request`. The filter is part of the cache key, so the
            views never share a cache entry.
      responses:
        "200":
          description: >
            Recent block rows. `prism.dashboard.blocks.v1` without
            `chain_state` (or with `chain_state=active`);
            `prism.dashboard.blocks.v2` for `chain_state=all` and
            `chain_state=reversed`.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BlocksResponse"
                  - $ref: "#/components/schemas/BlocksChainStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /blocks/{block_hash}/settlement-artifacts:
    get:
      tags: [dashboard]
      operationId: getBlockSettlementArtifacts
      summary: Get public settlement artifacts and CTV fanouts for a block.
      description: >
        Returns a public index of artifact hashes, canonical artifact URLs, and
        broadcastable fanout transaction data. Exact canonical artifacts may use
        their own `qbit.prism.*` schemas; this wrapper keeps dashboard-facing
        fields stable. Direct coinbase settlements return
        `settlement_mode: direct_coinbase` with an empty `fanouts` array.
      parameters:
        - name: block_hash
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HexHash"
      responses:
        "200":
          description: Public block settlement artifact index.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementArtifactsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /fanouts/pending:
    get:
      tags: [dashboard]
      operationId: getPendingFanouts
      summary: Get pending non-terminal CTV fanouts.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending fanout rows.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingFanoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /fanouts/{fanout_txid}:
    get:
      tags: [dashboard]
      operationId: getFanout
      summary: Get public CTV fanout status and broadcast artifact data.
      parameters:
        - name: fanout_txid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HexHash"
      responses:
        "200":
          description: Fanout status and broadcast data.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FanoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /artifacts/{sha256}:
    get:
      tags: [dashboard]
      operationId: getArtifact
      summary: Download a content-addressed public PRISM settlement artifact.
      description: >
        Serves exact canonical public artifacts such as audit bundles, CTV
        manifest sets, per-fanout manifests, or raw fanout transaction data.
        These artifacts are verified by their path SHA-256 and may use their own
        `qbit.prism.*` schemas. For audit bundles, CTV fanout manifests, and
        manifest sets the response body is the exact canonical byte sequence
        the hash was computed over, so `sha256(response body)` equals the path
        SHA-256. Audit bundles written before canonical-byte persistence retain
        the legacy reconstructed response until verified backfill.
        Dashboard-facing wrapper responses link here rather than inlining large
        canonical artifacts.
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HexHash"
      responses:
        "200":
          description: Canonical public settlement artifact.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalArtifact"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /mining-configuration:
    get:
      tags: [dashboard]
      operationId: getMiningConfiguration
      summary: Get public pool mining configuration and Stratum endpoints.
      description: >
        Supports a dashboard "next block" or configuration tab without
        hardcoding pool fee policy, block template policy, or public mining
        endpoints into the frontend. When the high-diff Stratum listener is
        enabled, it is advertised as an additional endpoint in
        `stratum_endpoints`.
      responses:
        "200":
          description: Public mining configuration.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiningConfigurationResponse"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /miners/{recipient_id}:
    get:
      tags: [dashboard]
      operationId: getMiner
      summary: Get public miner status by payout recipient id.
      parameters:
        - name: recipient_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Miner status.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /miners/{recipient_id}/earnings:
    get:
      tags: [dashboard]
      operationId: getMinerEarnings
      summary: Get paginated miner earnings by found block.
      parameters:
        - name: recipient_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Miner earnings rows.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinerEarningsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /miners/{recipient_id}/payouts:
    get:
      tags: [dashboard]
      operationId: getMinerPayouts
      summary: Get paginated miner payout history.
      parameters:
        - name: recipient_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Miner payout rows.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinerPayoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /miners/{recipient_id}/workers:
    get:
      tags: [dashboard]
      operationId: getMinerWorkers
      summary: Get paginated miner worker rows.
      parameters:
        - name: recipient_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: hide_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Miner worker rows.
          headers:
            Cache-Control:
              $ref: "#/components/headers/BrowserCacheControl"
            CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Vercel-CDN-Cache-Control:
              $ref: "#/components/headers/SharedCacheControl"
            Age:
              $ref: "#/components/headers/Age"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinerWorkersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
components:
  headers:
    BrowserCacheControl:
      description: Browser cache policy; public dashboard responses require revalidation in browsers.
      schema:
        type: string
        example: public, max-age=0, must-revalidate
    SharedCacheControl:
      description: Shared CDN cache policy with short TTL and stale-while-revalidate.
      schema:
        type: string
        example: public, max-age=5, stale-while-revalidate=30
    Age:
      description: Origin cache age in seconds for the returned response body.
      schema:
        type: string
        pattern: "^[0-9]+$"
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamUnavailable:
      description: Required pool or node data source is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    IsoTimestamp:
      type: string
      format: date-time
      description: UTC ISO-8601 timestamp.
    HexHash:
      type: string
      pattern: "^[0-9a-f]{64}$"
    HexString:
      type: string
      pattern: "^(?:[0-9a-f]{2})+$"
      description: Lowercase hex-encoded bytes; must be non-empty and even length.
    CompactBits:
      type: string
      pattern: "^[0-9a-f]{8}$"
    DecimalString:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Exact decimal quantity serialized as a string.
    Bits:
      type: integer
      minimum: 0
      description: Whole bits.
    NullableString:
      type:
        - string
        - "null"
    NullableTimestamp:
      oneOf:
        - $ref: "#/components/schemas/IsoTimestamp"
        - type: "null"
    HashrateRange:
      type: string
      enum: [1w, 1m, 6m, all]
      description: "Rolling history range. Values mean: 1w = 7 days, 1m = 30 days, 6m = 180 days, all = all retained history."
    HashrateBucket:
      type: string
      enum: [auto, 5m, 1h, 1d]
      description: "Time bucket size. Values mean: auto = server-selected, 5m = 5 minutes, 1h = 1 hour, 1d = 1 day."
    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total_count, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    NetworkSummary:
      type: object
      additionalProperties: false
      required:
        - name
        - height
        - tip_hash
        - bits
        - network_difficulty
        - hashrate_ths
        - initial_block_download
        - peers
      properties:
        name:
          type: string
        height:
          type: integer
          minimum: 0
        tip_hash:
          $ref: "#/components/schemas/HexHash"
        bits:
          $ref: "#/components/schemas/CompactBits"
        network_difficulty:
          $ref: "#/components/schemas/DecimalString"
        hashrate_ths:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
          description: >
            Estimated network hashrate in TH/s for the permissionless lane the
            pool mines, from the node's own recent-blocks estimate. Additive
            field on `prism.dashboard.pool-summary.v1` (2.x). Divide a pool
            `hashrate_ths` window (`h1`/`h3`) by this value for an approximate
            pool share-of-network: pool hashrate is credited work from
            accepted shares while this is a chain-derived estimate, so the
            ratio is approximate by construction. `null` when the node cannot
            answer; that failure never turns into a 503.
        initial_block_download:
          type: boolean
        peers:
          type: integer
          minimum: 0
    HashrateRollups:
      type: object
      additionalProperties: false
      required: [h1, h3, h24]
      properties:
        h1:
          $ref: "#/components/schemas/DecimalString"
        h3:
          $ref: "#/components/schemas/DecimalString"
        h24:
          $ref: "#/components/schemas/DecimalString"
    LatestBlock:
      type: object
      additionalProperties: false
      required:
        - height
        - hash
        - found_at
        - age_seconds
        - solver_recipient_id
        - solver_worker_name
      properties:
        height:
          type: integer
          minimum: 0
        hash:
          $ref: "#/components/schemas/HexHash"
        found_at:
          $ref: "#/components/schemas/IsoTimestamp"
        age_seconds:
          type: integer
          minimum: 0
        solver_recipient_id:
          type: string
        solver_worker_name:
          $ref: "#/components/schemas/NullableString"
    RewardWindowSummary:
      type: object
      additionalProperties: false
      required:
        - window_multiplier
        - requested_window_weight
        - oldest_share_accepted_at
        - newest_share_accepted_at
        - included_share_count
      properties:
        window_multiplier:
          type: integer
          minimum: 1
        requested_window_weight:
          $ref: "#/components/schemas/DecimalString"
        oldest_share_accepted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        newest_share_accepted_at:
          $ref: "#/components/schemas/NullableTimestamp"
        included_share_count:
          type: integer
          minimum: 0
    PoolFields:
      type: object
      additionalProperties: false
      required:
        - name
        - hashrate_ths
        - participants_3h
        - blocks_found_total
        - prism_blocks_total
        - blocks_reversed_total
        - blocks_inactive_total
        - total_mined_bits
        - expected_time_to_block_seconds
        - latest_block
        - reward_window
      properties:
        name:
          type: string
        hashrate_ths:
          $ref: "#/components/schemas/HashrateRollups"
        participants_3h:
          type: integer
          minimum: 0
        blocks_found_total:
          type: integer
          minimum: 0
          description: >
            Every pool block not reversed by a chain reorganization. Excludes
            `reversed` blocks by design; it is not the sum of the per-state
            counters below.
        prism_blocks_total:
          type: integer
          minimum: 0
        blocks_reversed_total:
          type: integer
          minimum: 0
          description: >
            Pool blocks a chain reorganization disconnected from the active
            chain. Additive field on `prism.dashboard.pool-summary.v1` (2.x);
            list the affected blocks with
            `GET /public/v1/blocks?chain_state=reversed`.
        blocks_inactive_total:
          type: integer
          minimum: 0
          description: >
            Pool blocks currently off the active chain but not yet resolved as
            reversed. Additive field on `prism.dashboard.pool-summary.v1`
            (2.x).
        total_mined_bits:
          $ref: "#/components/schemas/Bits"
        expected_time_to_block_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        latest_block:
          oneOf:
            - $ref: "#/components/schemas/LatestBlock"
            - type: "null"
        reward_window:
