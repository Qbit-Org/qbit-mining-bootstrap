        active chain. `prepared` blocks are still being landed, `confirmed`
        blocks are on the active chain, `inactive` blocks are temporarily off
        it, `rejected` blocks never activated, and `reversed` blocks were
        disconnected by a chain reorganization after the pool landed them.
