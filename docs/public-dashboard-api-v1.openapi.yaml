        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        network:
          $ref: "#/components/schemas/NetworkSummary"
        pool:
          $ref: "#/components/schemas/PoolFields"
    HashrateSubject:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              const: pool
            id:
              type: "null"
        - type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              const: miner
            id:
              type: string
              minLength: 1
    HashratePoint:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - hashrate_ths
        - accepted_share_count
        - accepted_share_difficulty
      properties:
        timestamp:
          $ref: "#/components/schemas/IsoTimestamp"
        hashrate_ths:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: >
            Trailing-smoothed credited hashrate estimated from accepted share
            difficulty. This is not router-side physical telemetry.
        accepted_share_count:
          type: integer
          minimum: 0
        accepted_share_difficulty:
          $ref: "#/components/schemas/DecimalString"
    HashrateSeriesResponse:
      type: object
      additionalProperties: false
      required: [schema, generated_at, subject, range, bucket, unit, points]
      properties:
        schema:
          type: string
          const: prism.dashboard.hashrate-series.v1
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        subject:
          $ref: "#/components/schemas/HashrateSubject"
        range:
          $ref: "#/components/schemas/HashrateRange"
        bucket:
          $ref: "#/components/schemas/HashrateBucket"
        unit:
          type: string
          const: ths
        points:
          type: array
          items:
            $ref: "#/components/schemas/HashratePoint"
    HashrateSmoothing:
      type: object
      additionalProperties: false
      required: [method, window_seconds]
      description: >
        How `smoothed_hashrate_ths` was produced. `trailing` averages credited
        difficulty over the trailing `window_seconds` ending at each bucket,
        with buckets missing from the series counting as zero. `none` means
        smoothing is disabled or configured shorter than two buckets: the
        window is then the bucket itself and the smoothed rate equals the raw
        rate.
      properties:
        method:
          type: string
          enum: [trailing, none]
        window_seconds:
          type: integer
          minimum: 1
    DualRateHashratePoint:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - raw_hashrate_ths
        - smoothed_hashrate_ths
        - accepted_share_count
        - accepted_share_difficulty
        - complete
      properties:
        timestamp:
          $ref: "#/components/schemas/IsoTimestamp"
        raw_hashrate_ths:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: >
            Credited difficulty in this bucket divided by the full
            `bucket_seconds`, even when the bucket is not yet complete. This
            is a credited-work estimate, not router telemetry; sparse
            high-difficulty shares can make an individual bucket over-read the
            delivered physical rate.
        smoothed_hashrate_ths:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: >
            Trailing-window credited rate, the same estimate v1 serves as
            `hashrate_ths`. Equals `raw_hashrate_ths` when the smoothing
            method is `none`.
        accepted_share_count:
          type: integer
          minimum: 0
        accepted_share_difficulty:
          $ref: "#/components/schemas/DecimalString"
        complete:
          type: boolean
          description: >
            False when `generated_at` falls before the bucket's end; the
            bucket is still accumulating credit and its raw rate under-reads.
    HashrateSeriesDualRateResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - generated_at
        - subject
        - range
        - bucket
        - bucket_seconds
        - unit
        - rate_basis
        - smoothing
        - points
      properties:
        schema:
          type: string
          const: prism.dashboard.hashrate-series.v2
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        subject:
          $ref: "#/components/schemas/HashrateSubject"
        range:
          $ref: "#/components/schemas/HashrateRange"
        bucket:
          $ref: "#/components/schemas/HashrateBucket"
        bucket_seconds:
          type: integer
          enum: [300, 3600, 86400]
          description: Duration of every bucket, and the divisor behind each raw rate.
        unit:
          type: string
          const: ths
        rate_basis:
          type: string
          const: accepted_share_difficulty
        smoothing:
          $ref: "#/components/schemas/HashrateSmoothing"
        points:
          type: array
          items:
            $ref: "#/components/schemas/DualRateHashratePoint"
