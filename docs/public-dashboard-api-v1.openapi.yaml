        - explorer_url
      properties:
        block_height:
          type: integer
          minimum: 0
        block_hash:
          $ref: "#/components/schemas/HexHash"
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
        transaction_id:
          description: >-
            Transaction carrying the recipient's on-chain output: the block's
            coinbase txid for `transaction_kind=coinbase`, the CTV fanout txid
            for `transaction_kind=ctv_fanout`, and null for
            `transaction_kind=carry_forward`.
          oneOf:
            - $ref: "#/components/schemas/HexHash"
            - type: "null"
        transaction_kind:
          type: string
          enum: [coinbase, ctv_fanout, carry_forward]
        onchain_amount_bits:
          description: >-
            Value of the recipient's committed on-chain output. For
            `ctv_fanout` rows this is the fanout output value (gross
            entitlement minus the recipient's fanout fee share), so it never
            exceeds the block's `net_earning_bits`.
          $ref: "#/components/schemas/Bits"
        carry_forward_balance_bits:
          $ref: "#/components/schemas/Bits"
        action:
          type: string
          enum: [onchain, accrued]
        maturity_state:
          type: string
          enum: [immature, mature, reversed]
        explorer_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
    MinerEarning:
      type: object
      additionalProperties: false
      required:
        - block_height
        - block_hash
        - found_at
        - reward_share_percent
        - gross_earning_bits
        - settlement_fee_bits
        - net_earning_bits
        - maturity_state
        - settlement_artifacts_url
        - explorer_url
      properties:
        block_height:
          type: integer
          minimum: 0
        block_hash:
          $ref: "#/components/schemas/HexHash"
        found_at:
          $ref: "#/components/schemas/IsoTimestamp"
        reward_share_percent:
          $ref: "#/components/schemas/DecimalString"
        gross_earning_bits:
          $ref: "#/components/schemas/Bits"
        settlement_fee_bits:
          $ref: "#/components/schemas/Bits"
        net_earning_bits:
          $ref: "#/components/schemas/Bits"
        maturity_state:
          type: string
          enum: [immature, mature, reversed]
        settlement_artifacts_url:
          oneOf:
            - type: string
              format: uri-reference
            - type: "null"
        explorer_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
    MinerEarningsResponse:
      type: object
      additionalProperties: false
      required: [schema, generated_at, recipient_id, pagination, rows]
      properties:
        schema:
          type: string
          const: prism.dashboard.miner-earnings.v1
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        recipient_id:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MinerEarning"
    MinerPayoutsResponse:
      type: object
      additionalProperties: false
      required: [schema, generated_at, recipient_id, pagination, rows]
      properties:
        schema:
          type: string
          const: prism.dashboard.miner-payouts.v1
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        recipient_id:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MinerPayout"
    MinerWorkersResponse:
      type: object
      additionalProperties: false
      required: [schema, generated_at, recipient_id, pagination, rows]
      properties:
        schema:
          type: string
          const: prism.dashboard.miner-workers.v1
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        recipient_id:
          type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MinerWorker"
    MinerResponse:
      type: object
      additionalProperties: false
      required:
        - schema
        - generated_at
        - recipient_id
        - display_name
        - owed_balance_bits
        - lifetime_earnings_bits
        - pending_maturity_bits
        - unpaid_earnings_bits
        - minimum_payout_bits
        - hashrate_ths
        - shares
        - estimated_next_block
        - estimated_time_to_minimum_payout_seconds
        - reward_window_percent
        - workers_currently_hashing
        - workers
        - recent_payouts
      properties:
        schema:
          type: string
          const: prism.dashboard.miner.v1
        generated_at:
          $ref: "#/components/schemas/IsoTimestamp"
        recipient_id:
          type: string
        display_name:
          $ref: "#/components/schemas/NullableString"
        owed_balance_bits:
          $ref: "#/components/schemas/Bits"
        lifetime_earnings_bits:
          $ref: "#/components/schemas/Bits"
        pending_maturity_bits:
          $ref: "#/components/schemas/Bits"
          description: >
            Total net settlement value allocated to this miner and not yet spendable because the
            confirmed parent coinbase remains subject to Qbit's 1,000-block maturity.
        unpaid_earnings_bits:
          $ref: "#/components/schemas/Bits"
        minimum_payout_bits:
          $ref: "#/components/schemas/Bits"
        hashrate_ths:
          $ref: "#/components/schemas/MinerHashrateRollups"
        shares:
          $ref: "#/components/schemas/MinerShareSummary"
        estimated_next_block:
          $ref: "#/components/schemas/MinerEstimate"
        estimated_time_to_minimum_payout_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        reward_window_percent:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        workers_currently_hashing:
          type: integer
          minimum: 0
        workers:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/MinerWorker"
        recent_payouts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/MinerPayout"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - not_found
            - rate_limited
            - internal_error
            - upstream_unavailable
        message:
          type: string
        request_id:
          $ref: "#/components/schemas/NullableString"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [schema, error]
      properties:
        schema:
          type: string
          const: prism.dashboard.error.v1
        error:
          $ref: "#/components/schemas/ErrorDetail"
