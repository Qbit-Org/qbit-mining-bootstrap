[package]
name = "qbit-prism"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT"
# Built and shipped from this repository; its path dependencies carry no
# version, which cargo-deny permits only for crates that are never published.
publish = false
description = "Payouts, Rewards, and Integrity Settlement Manifest pool accounting for qbit"

[dependencies]
qbit-pool-builder = { path = "../qbit-pool-builder" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
hex = "0.4"
# Every environment-gated test in this crate must take its inputs through the
# shared gate; see docs/prism-integration-test-gate.md.
qbit-prism-test-gate = { path = "../qbit-prism-test-gate" }
