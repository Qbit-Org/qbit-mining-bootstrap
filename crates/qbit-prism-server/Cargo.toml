[package]
name = "qbit-prism-server"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT"
# Built and shipped from this repository; its path dependencies carry no
# version, which cargo-deny permits only for crates that are never published.
publish = false
description = "Native multi-instance Stratum, accounting, and audit server for PRISM"
default-run = "qbit-prism-server"

[features]
# Test-only (#575): retain 16 KiB per accepted share, to show the load
# harness's soak fails its resident-memory gate on a leak. Never enabled by
# any build or image of this repository.
soak-leak-mutant = []

[dependencies]
qbit-prism = { path = "../qbit-prism" }
qbit-pool-builder = { path = "../qbit-pool-builder" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
# The readiness endpoint's HTTP/1 connections, with their own deadlines (3.1).
# Both are already in the graph through axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
qbit-prism-test-gate = { path = "../qbit-prism-test-gate" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
http-body-util = "0.1"
# Property tests for the Stratum line codec and target conversions (#575).
proptest = { version = "1", default-features = false, features = ["std"] }
