# actionlint configuration: the workflow runs on Blacksmith runners, whose
# labels actionlint does not know.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    # The nightly load harness (prism-load-nightly.yml) runs its presets on
    # the runner each preset names.
    - blacksmith-8vcpu-ubuntu-2404
    - blacksmith-16vcpu-ubuntu-2404
    # The runner probe (prism-load-runner-probe.yml, #541) also measures the
    # 32 vCPU class.
    - blacksmith-32vcpu-ubuntu-2404
