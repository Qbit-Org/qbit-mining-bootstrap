name: CI

on:
  pull_request:
  # Pull requests are tested as their merge result; a push to a PR branch
  # would run the same jobs a second time. Push runs cover direct commits
  # to the long-lived branches only.
  push:
    branches:
      - main
      - 1.x.x
      - 2.x.x
      - 3.x.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-compile-compose:
    name: Lint, compile, and Compose validation
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install lint tools
        uses: ./.github/actions/apt-install
        with:
          packages: shellcheck

      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n

      - name: ShellCheck shell scripts
        run: |
          touch .env
          git ls-files '*.sh' | xargs shellcheck -x

      - name: Compile Python sources
        run: python -m compileall -q docker lab tests examples scripts

      - name: Validate mainnet Compose contract
        run: python -m unittest tests.test_mainnet_compose_contract

      - name: Validate Docker Compose files
        run: |
          export QBIT_SRC_DIR="$PWD"
          export PRISM_STRATUM_PORT_HOST=127.0.0.1:43340
          export PRISM_STRATUM_PORT=43340
          for profile in permissionless real-miner-smoke auxpow prism; do
            docker compose \
              --env-file config/upstream.env.example \
              --env-file .env.example \
              -f compose.yaml \
              --profile "$profile" \
              config --quiet
          done
          docker compose --env-file config/upstream.env.example --env-file .env.example \
            -f compose.yaml -f compose.prism-external-db.yaml --profile prism config --quiet

      - name: Validate PRISM HA Compose stacks
        run: |
          export QBIT_SRC_DIR="$PWD"
          for overlays in "" "-f compose.production.yaml" "-f compose.prism-external-db.yaml" "-f compose.production.yaml -f compose.prism-external-db.yaml"; do
            (
              unset PRISM_DATABASE_URL
              if [[ "$overlays" == *compose.prism-external-db.yaml* ]]; then
                export PRISM_DATABASE_URL=postgresql://fixture:fixture@writer.example:5432/prism
              fi
              docker compose --env-file config/upstream.env.example --env-file .env.example \
                -f compose.yaml $overlays -f compose.prism-ha.yaml --profile prism config --format json |
                jq -e '
                  [.services["prism-coordinator"], .services["prism-coordinator-2"]] as $pair |
                  ($pair | all(.environment.PRISM_AUDIT_BIND == "0.0.0.0")) and
                  ($pair | all(. as $s |
                    (.environment.PRISM_AUDIT_PORT | tonumber) > 0 and
                    any(.ports[]; .target == ($s.environment.PRISM_AUDIT_PORT | tonumber)))) and
                  ([$pair[].environment.PRISM_INSTANCE_ID] | unique | length == 2) and
                  ([$pair[].environment.PRISM_DATABASE_URL] | unique | length == 1) and
                  ([$pair[].ports[] | select(.published != "0") | .published] |
                    length == (unique | length))'
            )
          done

  python-tests:
    name: Python unit tests (shard ${{ matrix.shard }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Python unit test shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: GIT_CONFIG_GLOBAL=/dev/null python scripts/run_python_test_shard.py --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT"

  rust-tests:
    name: Rust tests
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check VERSION against every workspace crate
        run: python3 scripts/check_version_skew.py

      - name: Run Rust tests
        # This job has no database. With CI set and no database the JSONB
        # ceiling gate fails instead of skipping, so it runs in
        # prism-native-postgres and is skipped here by name.
        run: cargo test --locked --workspace --all-targets -- --skip jsonb_ceiling_ratchet_at_reduced_sizes

  checks:
    # Preserve the existing check name for branch protection and consumers.
    name: Lint, compile, and test
    if: ${{ always() }}
    needs: [lint-compile-compose, python-tests, rust-tests, prism-native-postgres]
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  ckpool-rejects-observability:
    name: ckpool rejects observability live suite
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ckpool build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            autoconf automake build-essential libtool pkgconf yasm
            libcurl4-openssl-dev libjansson-dev libzmq3-dev

      - name: Build patched ckpool and run live regression and load tests
        run: make test-ckpool-rejects-observability

  prism-native-postgres:
    name: Rust PRISM PostgreSQL and multi-instance contracts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prism_test
          POSTGRES_USER: prism_test
          POSTGRES_PASSWORD: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PRISM_TEST_DATABASE_URL: postgresql://prism_test:prism_test@127.0.0.1:5432/prism_test
      PRISM_TEST_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install tools for disposable primary and standby failover test
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-16
      - name: Install pinned qbit for native mining and CTV integration
        run: |
          set -euo pipefail
          prism_qbit_dir="${RUNNER_TEMP}/prism-qbit"
          mkdir -p "${prism_qbit_dir}"
          cd "${prism_qbit_dir}"
          curl --fail --location --retry 3 \
            --output qbit-1.0.0-x86_64-linux-gnu.tar.gz \
            https://github.com/Qbit-Org/qbit/releases/download/v1.0.0/qbit-1.0.0-x86_64-linux-gnu.tar.gz
          printf '%s  %s\n' \
            ae121af03263b55d530e3f3e8719a71362d0950cba82f54a2bc2d6c437a029b5 \
            qbit-1.0.0-x86_64-linux-gnu.tar.gz | sha256sum --check
          tar -xzf qbit-1.0.0-x86_64-linux-gnu.tar.gz
          printf 'QBITD_BIN=%s/qbit-1.0.0/bin/qbitd\n' "${prism_qbit_dir}" >> "${GITHUB_ENV}"
      - name: Run native ledger, API, and Stratum tests
        run: cargo test --locked -p qbit-prism-server --all-targets
      - name: Verify unsubscribed connections do not consume shared mining IDs
        run: >-
          cargo test --locked -p qbit-prism-server
          --test stratum_admission_postgres -- --ignored --exact
          ten_thousand_unsubscribed_connections_do_not_advance_postgres_sequence
      - name: Exercise native metrics collectors against PostgreSQL
        run: cargo test --locked -p qbit-prism-server --test observability_database -- --ignored

  docker-builds:
    name: Build lightweight Docker images
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Create qbit functional-test build context
        run: mkdir -p /tmp/qbit-functional-fixture/test/functional

      - name: Build miner simulator image
        run: docker build -f lab/miner-sim/Dockerfile .

      - name: Build AuxPoW coordinator image
        run: |
          docker buildx build \
            --build-context qbit-src=/tmp/qbit-functional-fixture \
            --load \
            -f lab/auxpow/Dockerfile \
            .

      - name: Build PRISM coordinator image
        run: |
          docker buildx build \
            --build-context qbit-src=/tmp/qbit-functional-fixture \
            --load \
            --tag qbit-lab-prism:ci \
            -f lab/prism/Dockerfile \
            .

      - name: Smoke native PRISM runtime image
        run: |
          docker run --rm --network none qbit-lab-prism:ci qbit-prism-server --help
          docker run --rm --network none --cpus 1 --memory 512m \
            qbit-lab-prism:ci qbit-prism-server benchmark \
            --shares 32 --miners 4 --iterations 1

  qbit-runtime-image:
    name: Build and smoke real qbitd image
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      QBIT_CI_COMMIT: 7ebcddb622d6e639041f005a189b048ec2a221fe
      QBIT_CI_IMAGE: qbit-lab-qbitd:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native target-difficulty probe
        run: cargo build --locked -p qbit-prism-server --bin qbit-prism-server

      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      # The runtime smoke derives its header-bits assertion from PRISM's own
      # difficulty helpers, so this job needs the same interpreter the unit
      # tests run under rather than whatever the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Stage pinned qbit source
        run: |
          set -euo pipefail
          qbit_git="${RUNNER_TEMP}/qbit-git"
          qbit_src="${RUNNER_TEMP}/qbit-src"
          mkdir -p "${qbit_git}" "${qbit_src}"
          git -C "${qbit_git}" init --quiet
          git -C "${qbit_git}" remote add origin https://github.com/Qbit-Org/qbit.git
          git -C "${qbit_git}" fetch --depth=1 origin "${QBIT_CI_COMMIT}"
          resolved_commit="$(git -C "${qbit_git}" rev-parse FETCH_HEAD)"
          if [[ "${resolved_commit}" != "${QBIT_CI_COMMIT}" ]]; then
            printf 'qbit source resolved %s, expected %s\n' \
              "${resolved_commit}" "${QBIT_CI_COMMIT}" >&2
            exit 1
          fi
          git -C "${qbit_git}" archive "${resolved_commit}" | tar -x -C "${qbit_src}"
          printf 'qbit CI source: %s\n' "${resolved_commit}"

      - name: Build real qbitd image
        run: |
          docker buildx build \
            --build-context qbit-src="${RUNNER_TEMP}/qbit-src" \
            --load \
            --tag "${QBIT_CI_IMAGE}" \
            -f docker/qbit/Dockerfile \
            .

      - name: Smoke real qbitd runtime
        run: bash .github/scripts/test-qbit-image-runtime.sh
