name: PRISM load harness (nightly)

# #521 item 6: the load harness (qbit-prism-load) on checked-in presets, every
# night and on demand. Each preset in crates/qbit-prism-load/presets pins
# every flag its result depends on (a unit test refuses one that does not),
# names the runner it needs and states its gates, so what runs, where, and
# what it is held to are all reviewed in one file.
#
# The plan job pins the chosen ref to one commit for the whole matrix, and
# one job builds qbit-prism-server and qbit-prism-load in release mode there.
# Each preset job downloads those binaries, records pg_test_fsync on the
# filesystem the harness puts its PostgreSQL cluster on, runs the preset,
# and gates it with qbit-prism-load-gate: exit 0 (completed and reconciled
# exactly), no acknowledged share missing, no durability finding,
# shortfall == 0 in each gated phase, #473's D1 rule where the preset asks
# for it, and the tip-to-last-notify p99 budget where the preset sets one. The verdict table goes to the job summary and the
# harness's reports to an artifact.
#
# Runners: every nightly preset runs on an 8 vCPU runner, the size #271's
# 20k matrix was taken on; that includes one 400k D1 cell of #473's
# (throughput-400k-window-1fe-async, the production-window baseline) and the 400k
# realism and #275 presets. The heavier manual presets (#473's multi-frontend
# and 500k cells, mainnet-shape-2600-addresses's 8,000 sessions on four frontends) take a
# 16 vCPU runner so the client and the database do not starve the frontends
# being measured. Rates are only comparable run to run on the same runner
# class, which is why the runner is part of the preset.
#
# Once a week the `live-weekly` job runs the longer live regtest scenarios
# listed in test/prism-weekly-gated-tests.txt instead (#487's L4 weekly set):
# today #545's 2.x.x migration lifecycle and #575's measured cutover of a
# mainnet-shaped 2.x.x ledger. The weekly schedule runs only that job; the
# nightly jobs keep their own schedule.
#
# Schedules run from the default branch's copy of this file; the build and
# the presets come from `ref` (3.x.x unless dispatched otherwise).
#
# #549 (S3 of #487):
#   - A maintainer applying the `run-load` label to a PR runs the nightly
#     preset set against the PR's merge result, on `pull_request` (never
#     `pull_request_target`), in a concurrency group of its own so it can
#     never cancel a queued nightly. Only the `labeled` event starts it: a
#     later push needs the label applied again. Other labels start nothing.
#   - The guard job ends the nightly schedule early when 3.x.x's head is the
#     commit the last scheduled nightly tested, and cancels the run so the
#     skip shows as cancelled, never as passed. A nightly records the commit
#     it tested in its `prism-load-tested-commit` artifact once every preset
#     reached its gate, pass or fail. The weekly schedule and dispatches
#     are never skipped.
#   - Each preset's artifact carries host.json (runner label, filesystem mount
#     options, block device write cache and FUA) and is kept for 90 days
#     (#487 decision 3).
#   - A failed scheduled run opens, or comments on, the one open issue
#     labelled `prism-load-nightly-failure`, until S6 (#551) has its own
#     tracking issue. GitHub itself only emails whoever last edited the cron.

on:
  schedule:
    - cron: "17 2 * * *"
    # Weekly, on Sunday. The jobs' `if` conditions compare against both crons.
    - cron: "43 3 * * 0"
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      preset:
        description: >-
          Preset name(s), comma separated, from crates/qbit-prism-load/presets;
          `nightly` for the nightly set, `all` for nightly plus manual
          (mainnet-shape-2600-addresses and #473's cells other than 400k fe1 async).
        required: true
        default: nightly
      ref:
        description: Git ref to build and run.
        required: true
        default: 3.x.x
      tip_last_notify_p99_budget_ms:
        description: >-
          Override every selected preset's tip-to-last-notify p99 budget, in
          ms. Empty keeps each preset's own (gates.tip_last_notify_p99_budget_ms:
          2,500 for tip-delivery-2000-miners-400k-2fe-retarget*, 3,000 for mainnet-shape-130-addresses and mainnet-shape-650-addresses, 5,000 for
          mainnet-shape-2600-addresses; ungated for the D1 presets, whose rule is #473's).
        required: false
        default: ""
      max_shortfall:
        description: >-
          Override every selected preset's per-phase shortfall budget. Empty
          keeps each preset's own (0 for every checked-in preset).
        required: false
        default: ""
      live:
        description: >-
          Also run the opt-in live regtest variants listed in
          test/prism-nightly-gated-tests.txt (the schedule always does).
        type: boolean
        required: false
        default: true
      weekly:
        description: >-
          Also run the weekly live regtest scenarios listed in
          test/prism-weekly-gated-tests.txt (the weekly schedule always does).
        type: boolean
        required: false
        default: false
      fuzz:
        description: >-
          Also run the time-boxed Stratum fuzz targets (#575; the nightly
          schedule always does).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A labelled PR run gets a group per PR and label, so it never waits on or
# cancels a nightly, and another label's (empty) run never cancels a pending
# run-load run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('prism-load-pr-{0}-{1}', github.event.pull_request.number, github.event.label.name) || 'prism-load-nightly' }}
  cancel-in-progress: false

jobs:
  # Every job but live-weekly and report needs this one, so on a PR it is
  # the one place the label is checked, and on the nightly schedule it is the
  # P4 cost lever: nothing starts when 3.x.x has not moved.
  guard:
    name: Skip an unchanged night
    if: >-
      ${{ github.event.schedule != '43 3 * * 0'
      && (github.event_name != 'pull_request' || github.event.label.name == 'run-load') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: write
      contents: read
    outputs:
      skip: ${{ steps.last.outputs.skip }}
    steps:
      - name: Compare 3.x.x's head with the commit the last nightly tested
        id: last
        if: ${{ github.event.schedule == '17 2 * * *' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${REPO}/commits/3.x.x" --jq .sha)" || head=""
          # Only a scheduled nightly's report job uploads the artifact, and
          # the artifacts API lists it newest first however many skipped
          # (cancelled) or weekly runs came since, so the first unexpired one
          # from the default branch is what the last nightly tested. Any
          # failure to find or read it runs the night: a skip needs positive
          # evidence.
          tested="" tested_run=""
          tested_run="$(gh api "repos/${REPO}/actions/artifacts?name=prism-load-tested-commit&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false
                    and .workflow_run.head_branch == \"${DEFAULT_BRANCH}\"
                    and .workflow_run.id != ${RUN_ID})][0].workflow_run.id // empty")" || tested_run=""
          dir="${RUNNER_TEMP}/tested"
          if [[ -n "${tested_run}" ]] \
            && gh run download "${tested_run}" --repo "${REPO}" -n prism-load-tested-commit -D "${dir}" \
            && [[ -s "${dir}/commit" ]]; then
            tested="$(tr -d '[:space:]' < "${dir}/commit")"
          fi
          echo "3.x.x is at ${head}; the last nightly tested ${tested:-nothing found} (run ${tested_run:-none})"
          if [[ -n "${head}" && "${tested}" == "${head}" ]]; then
            printf 'skip=true\n' >> "${GITHUB_OUTPUT}"
            {
              echo "### Skipped: 3.x.x has not moved"
              echo
              echo "3.x.x is still at \`${head}\`, which [run ${tested_run}](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${tested_run}) tested."
              echo "This run is cancelled so the skip does not show as a pass."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'skip=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Cancel the run
        if: ${{ steps.last.outputs.skip == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh run cancel "${RUN_ID}" --repo "${REPO}"
          # The cancellation ends this job; if it has not within five
          # minutes, fail rather than let the skip read as a pass. The other
          # jobs are skipped on this job's output either way.
          for _ in $(seq 30); do sleep 10; done
          echo "the run was not cancelled within five minutes" >&2
          exit 1

  plan:
    name: Plan the preset matrix
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # A labelled PR runs its merge result (refs/pull/N/merge), which is
      # what would land; everything else runs `ref`, 3.x.x by default.
      - name: Check out the ref under test
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || inputs.ref || '3.x.x' }}
      - name: Select presets and pin the commit
        id: plan
        env:
          SELECTION: ${{ inputs.preset || 'nightly' }}
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/prism_load_matrix.py "${SELECTION}")"
          echo "${matrix}"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          # Every later job checks out this commit, so the binaries built
          # once and the presets each run reads are the same revision even
          # if the ref moves while the matrix runs.
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build the release binaries once
    needs: plan
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out the pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
      - name: Build the server, the harness and the gate in release mode
        run: cargo build --locked --release -p qbit-prism-server -p qbit-prism-load
      # The Cargo dep-info files go with the binaries: the harness ties the
      # server to the checkout through them, as it does for a local build.
      # A tar keeps the executable bits an artifact upload would drop.
      - name: Pack the binaries and their dep-info
        run: |
          set -euo pipefail
          tar -C target/release -cf "${RUNNER_TEMP}/prism-load-binaries.tar" \
            qbit-prism-server qbit-prism-server.d \
            qbit-prism-load qbit-prism-load.d qbit-prism-load-gate
      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: prism-load-binaries
          overwrite: true
          retention-days: 3
          path: ${{ runner.temp }}/prism-load-binaries.tar
          if-no-files-found: error

  run:
    name: ${{ matrix.preset }}
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install PostgreSQL 16 server binaries
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-16
      - name: Download the binaries built once
        uses: actions/download-artifact@v8
        with:
          name: prism-load-binaries
          path: ${{ runner.temp }}
      # Unpacked where a local release build puts them, at the same workspace
      # path they were built at, and stamped after this checkout, so the
      # harness can show the server was built from the sources beside it.
      - name: Unpack the binaries into target/release
        run: |
          set -euo pipefail
          mkdir -p target/release
          tar -C target/release -xf "${RUNNER_TEMP}/prism-load-binaries.tar"
          touch target/release/qbit-prism-server target/release/qbit-prism-load \
            target/release/qbit-prism-load-gate
      - name: Name the run in the summary
        env:
          PRESET: ${{ matrix.preset }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          {
            echo "### ${PRESET} on ${RUNNER_LABEL}"
            echo
            echo "Commit \`$(git rev-parse HEAD)\`; the host, its disk and the runner label are in host.json below."
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Run and gate the preset
        env:
          PRISM_LOAD_TIP_LAST_NOTIFY_P99_BUDGET_MS: ${{ inputs.tip_last_notify_p99_budget_ms }}
          PRISM_LOAD_MAX_SHORTFALL: ${{ inputs.max_shortfall }}
          PRESET: ${{ matrix.preset }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: bash .github/scripts/prism-load-run.sh "${PRESET}" "${RUNNER_TEMP}/prism-load-out"
      # prism-load-run.sh writes gate.md only once the gate has read the
      # harness's result, pass or fail. The report job records a nightly's
      # commit as tested only if every planned preset left this marker, so a
      # setup or runner failure before the gate is retried the next night.
      - name: Mark the preset as gated
        if: ${{ !cancelled() }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gated"
          if [[ -f "${RUNNER_TEMP}/prism-load-out/gate.md" ]]; then
            touch "${RUNNER_TEMP}/gated/${PRESET}"
          fi
      - name: Upload the gated marker
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-load-gated-${{ matrix.preset }}
          overwrite: true
          retention-days: 3
          path: ${{ runner.temp }}/gated
          if-no-files-found: ignore
      - name: Upload the harness reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-load-${{ matrix.preset }}
          overwrite: true
          # #487 decision 3: the load evidence is kept 90 days.
          retention-days: 90
          path: ${{ runner.temp }}/prism-load-out
          if-no-files-found: error

  # The opt-in #[ignore] live_regtest variants (#521): each id in
  # test/prism-nightly-gated-tests.txt, run explicitly with --ignored --exact
  # in required integration mode against a real qbitd and PostgreSQL 16, and
  # proven executed with the same gate manifest check the PR suite uses.
  # That is #523's qbitd -reindex crash variant, #524's 130-payee
  # weighted-recipients variant, scenario 5's dense-cadence soak, and #575's
  # PostgreSQL disk-exhaustion and wall-clock-jump variants.
  live-nightly:
    name: Live regtest nightly variants
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' && (github.event.schedule == '17 2 * * *' || inputs.live) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prism_test
          POSTGRES_USER: prism_test
          POSTGRES_PASSWORD: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PRISM_TEST_DATABASE_URL: postgresql://prism_test:prism_test@127.0.0.1:5432/prism_test
      PRISM_TEST_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      PRISM_TEST_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Check out the ref under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '3.x.x' }}
      - name: Name the gate manifest and the test log
        run: |
          printf 'PRISM_TEST_GATE_MANIFEST=%s/prism-nightly-gate-manifest.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'PRISM_TEST_LOG=%s/prism-nightly-tests.log\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install PostgreSQL 16 server binaries
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-16
      # #575: the disk-exhaustion variant mounts a small ext4 image with
      # fuse2fs (no root), the clock-jump variant preloads libfaketime.
      - name: Install the disk-full and clock-jump tools
        uses: ./.github/actions/apt-install
        with:
          packages: fuse2fs fuse3 faketime libfaketime
      - name: Restore the pinned qbit release from the cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/prism-qbit
          key: prism-qbit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-prism-qbit.sh') }}
      - name: Install pinned qbit
        run: |
          set -euo pipefail
          PRISM_QBIT_CACHE_DIR="${HOME}/.cache/prism-qbit" \
            bash .github/scripts/install-prism-qbit.sh "${RUNNER_TEMP}/prism-qbit"
      - name: Run the listed variants
        run: |
          set -euo pipefail
          mapfile -t tests < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' test/prism-nightly-gated-tests.txt \
            | grep -v '^$' | sed 's/^qbit-prism-server::live_regtest:://')
          cargo test --locked -p qbit-prism-server --test live_regtest -- \
            --ignored --exact --test-threads=1 --nocapture "${tests[@]}" 2>&1 | tee "${PRISM_TEST_LOG}"
      - name: Prove every listed variant executed
        run: |
          python3 scripts/check_gate_manifest.py \
            --manifest "${PRISM_TEST_GATE_MANIFEST}" \
            --expected test/prism-nightly-gated-tests.txt \
            --log "${PRISM_TEST_LOG}"
      - name: Upload the gate manifest and the test log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-live-nightly
          overwrite: true
          retention-days: 30
          path: |
            ${{ env.PRISM_TEST_GATE_MANIFEST }}
            ${{ env.PRISM_TEST_LOG }}
          if-no-files-found: error

  # The weekly #[ignore] live_regtest scenarios (#487 L4): each id in
  # test/prism-weekly-gated-tests.txt, run as live-nightly runs its list, with
  # PostgreSQL's client tools for the scenarios' pg_dump and psql. Today that
  # is #545's migration lifecycle: a scaled 2.x.x ledger through migrate,
  # import-audits, native mining on the real node, exact reconciliation and
  # the isolated-restore rollback of docs/prism-rust-migration.md.
  live-weekly:
    name: Live regtest weekly scenarios
    if: ${{ github.event.schedule == '43 3 * * 0' || inputs.weekly }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # #575's scenario writes mainnet's 13,566 blocks and about 2M of its 65.5M
    # share rows (1x at 1/32 until #582 lands, then 1/16 at 4.1M rows), keeps
    # two copies of that ledger (about 8 GB at 1/32, 15 GB at 1/16)
    # in the service database, and cuts it over. It takes 7.6 minutes at 1/64
    # of the rows on a 22-core host in release, and its row-proportional
    # phases put 1/16 near 20 minutes there, so the job builds in release and
    # allows two hours.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prism_test
          POSTGRES_USER: prism_test
          POSTGRES_PASSWORD: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PRISM_TEST_DATABASE_URL: postgresql://prism_test:prism_test@127.0.0.1:5432/prism_test
      PRISM_TEST_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      PRISM_TEST_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Check out the ref under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '3.x.x' }}
      - name: Name the gate manifest and the test log
        run: |
          printf 'PRISM_TEST_GATE_MANIFEST=%s/prism-weekly-gate-manifest.txt\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'PRISM_TEST_LOG=%s/prism-weekly-tests.log\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install PostgreSQL 16 server binaries
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-16
      - name: Restore the pinned qbit release from the cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/prism-qbit
          key: prism-qbit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-prism-qbit.sh') }}
      - name: Install pinned qbit
        run: |
          set -euo pipefail
          PRISM_QBIT_CACHE_DIR="${HOME}/.cache/prism-qbit" \
            bash .github/scripts/install-prism-qbit.sh "${RUNNER_TEMP}/prism-qbit"
      - name: Run the listed scenarios
        run: |
          set -euo pipefail
          mapfile -t tests < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' test/prism-weekly-gated-tests.txt \
            | grep -v '^$' | sed 's/^qbit-prism-server::live_regtest:://')
          cargo test --locked --release -p qbit-prism-server --test live_regtest -- \
            --ignored --exact --test-threads=1 --nocapture "${tests[@]}" 2>&1 | tee "${PRISM_TEST_LOG}"
      - name: Prove every listed scenario executed
        run: |
          python3 scripts/check_gate_manifest.py \
            --manifest "${PRISM_TEST_GATE_MANIFEST}" \
            --expected test/prism-weekly-gated-tests.txt \
            --log "${PRISM_TEST_LOG}"
      - name: Upload the gate manifest and the test log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-live-weekly
          overwrite: true
          retention-days: 30
          path: |
            ${{ env.PRISM_TEST_GATE_MANIFEST }}
            ${{ env.PRISM_TEST_LOG }}
          if-no-files-found: error

  # #575: the Stratum cargo-fuzz targets in crates/qbit-prism-server/fuzz
  # (line codec, per-connection session state machine, codec parsers), all
  # three at once for 20 minutes, from the checked-in seeds plus the corpus
  # the previous night kept. Gated on no crash, leak, timeout or OOM input;
  # the corpus is saved either way, and any finding is uploaded with the logs.
  # .github/scripts/prism-stratum-fuzz.sh pins the nightly toolchain and
  # cargo-fuzz and says how to reproduce a finding.
  stratum-fuzz:
    name: Stratum fuzzing (20 min)
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' && (github.event.schedule == '17 2 * * *' || inputs.fuzz) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out the ref under test
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '3.x.x' }}
      - name: Restore the kept corpus
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/stratum-fuzz-corpus
          key: prism-stratum-fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: prism-stratum-fuzz-corpus-v1-
      - name: Run the fuzz targets and gate on no crash
        run: |
          bash .github/scripts/prism-stratum-fuzz.sh \
            "${RUNNER_TEMP}/stratum-fuzz-corpus" "${RUNNER_TEMP}/stratum-fuzz-out" 1200
      - name: Keep the corpus for the next night
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/stratum-fuzz-corpus
          key: prism-stratum-fuzz-corpus-v1-${{ github.run_id }}
      - name: Upload the logs and any crashing inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-stratum-fuzz
          overwrite: true
          retention-days: 30
          path: ${{ runner.temp }}/stratum-fuzz-out
          if-no-files-found: error

  # #549: what a scheduled run leaves behind. The nightly records the commit
  # its presets ran to a verdict on, for the guard's next comparison, and any
  # failed scheduled run, nightly or weekly, opens or updates the one open
  # `prism-load-nightly-failure` issue. A cancelled run (a skipped night)
  # does neither.
  report:
    name: Record the tested commit and report a failure
    needs: [guard, plan, build, run, live-nightly, live-weekly, stratum-fuzz]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the gated markers
        id: gated
        if: >-
          ${{ github.event.schedule == '17 2 * * *'
          && (needs.run.result == 'success' || needs.run.result == 'failure') }}
        # No preset reaching its gate means no markers to download.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: prism-load-gated-*
          path: ${{ runner.temp }}/gated
          merge-multiple: true
      - name: Write the tested commit if every preset reached its gate
        id: tested
        if: ${{ steps.gated.conclusion == 'success' }}
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gated" "${RUNNER_TEMP}/tested"
          missing="$(jq -r '.include[].preset' <<<"${MATRIX}" | while read -r preset; do
            [[ -f "${RUNNER_TEMP}/gated/${preset}" ]] || echo "${preset}"
          done)"
          if [[ -n "${missing}" ]]; then
            echo "Not recorded as tested; these presets never reached their gate:" "${missing}"
            exit 0
          fi
          printf '%s\n' "${SHA}" > "${RUNNER_TEMP}/tested/commit"
          printf 'recorded=true\n' >> "${GITHUB_OUTPUT}"
      - name: Upload the tested commit
        if: ${{ steps.tested.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: prism-load-tested-commit
          overwrite: true
          retention-days: 90
          path: ${{ runner.temp }}/tested/commit
          if-no-files-found: error
      - name: Open or update the failure issue
        if: ${{ contains(needs.*.result, 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCHEDULE: ${{ github.event.schedule == '43 3 * * 0' && 'weekly' || 'nightly' }}
          SHA: ${{ needs.plan.outputs.sha }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          label=prism-load-nightly-failure
          gh label create "${label}" --repo "${REPO}" --color B60205 \
            --description "A scheduled prism-load-nightly.yml run failed (#549)" 2>/dev/null || true
          # The backticks are Markdown, not command substitution.
          # shellcheck disable=SC2016
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | "- `\(.key)`"' <<<"${RESULTS}")"
          # shellcheck disable=SC2016
          body="$(printf 'The %s scheduled run failed: %s\n\nCommit: `%s`\n\nFailed jobs:\n%s\n' \
            "${SCHEDULE}" "${RUN_URL}" "${SHA:-3.x.x (the weekly job checks out the branch)}" "${failed}")"
          issue="$(gh issue list --repo "${REPO}" --label "${label}" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --repo "${REPO}" --body "${body}"
          else
            gh issue create --repo "${REPO}" --label "${label}" \
              --title "PRISM load nightly: a scheduled run failed" \
              --body "${body}

          Opened by the report job of .github/workflows/prism-load-nightly.yml (#549). Later failures comment here while it is open; close it once the cause is fixed."
          fi
