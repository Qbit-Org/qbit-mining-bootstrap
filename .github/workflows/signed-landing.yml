# Required check: a pull request is ready to land only as one commit that a
# person signed with an OpenPGP key of their own. GitHub's signature rule also
# accepts commits GitHub signs itself (web edits, "Update branch" merges,
# bots), so this check tells them apart. A branch listed in AS_IS_HEADS merges
# as it is instead, and is not judged.
#
# It always runs from the default branch's copy of this file
# (pull_request_target), whatever branch the pull request targets, so a pull
# request can't change the rule it is judged by. It reads the pull request
# through the API and never checks out or runs its code. GitHub blocks this
# event in public repositories unless an Actions policy allows it for this
# file.
#
# .github/rulesets/README.md says how a pull request lands.
name: signed-landing

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  pull-requests: read

concurrency:
  # Per head commit: a run for an older head never cancels the current one's.
  group: signed-landing-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  signed-landing:
    name: signed-landing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: One commit, signed by a person
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_STATE: ${{ github.event.pull_request.state }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          AS_IS_HEADS: "sync-*"
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import fnmatch
          import http.client
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          # GitHub's own signing keys (https://github.com/web-flow.gpg). A commit they
          # sign is verified, but no person signed it. The list only makes the message
          # clearer: what decides is that the signing key is one of the committer's own.
          GITHUB_KEY_IDS = {"B5690EEEBB952194", "4AEE18F83AFDEB23"}
          LOGIN = re.compile(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?")
          ARMOR = re.compile(r"^-----BEGIN PGP SIGNATURE-----\n(?:[^\n:]+:[^\n]*\n)*\n"
                             r"([A-Za-z0-9+/=\n]+?)\n(?:=[A-Za-z0-9+/]{4}\n)?-----END PGP SIGNATURE-----$")
          LISTED = 100      # GitHub's largest page: a shorter answer is the whole list
          PAGES = 10        # pages of open pull requests read when looking for others with the same head
          HOW = "A maintainer squashes the pull request into one commit, signs it and pushes it before merging."


          class NotReady(Exception):
              """The pull request can't land as it is."""


          class Unknown(Exception):
              """GitHub's answer could not be read, so nothing was decided."""


          class Behind(Unknown):
              """GitHub's answer doesn't show the commit this run is for. Right after a
              push that is usually a read that hasn't caught up, so it is worth asking again."""


          def subpacket_issuers(body, pos):
              """The issuer key IDs a v4 signature names, as (hashed, unhashed). The
              hashed area is covered by the signature. The unhashed area is not: anyone
              can add an issuer there without breaking the signature."""
              areas = []
              for _area in ("hashed", "unhashed"):
                  ids = []
                  end = pos + 2 + int.from_bytes(body[pos:pos + 2], "big")
                  pos += 2
                  if end > len(body):
                      raise ValueError("subpacket area overruns the packet")
                  while pos < end:
                      octet = body[pos]
                      if octet < 192:
                          length, pos = octet, pos + 1
                      elif octet < 255:
                          length, pos = ((octet - 192) << 8) + body[pos + 1] + 192, pos + 2
                      else:
                          length, pos = int.from_bytes(body[pos + 1:pos + 5], "big"), pos + 5
                      if length < 1 or pos + length > end:
                          raise ValueError("bad subpacket length")
                      kind, value = body[pos] & 0x7F, body[pos + 1:pos + length]
                      pos += length
                      if kind == 16 and len(value) == 8:                        # issuer key ID
                          ids.append(value.hex().upper())
                      elif kind == 33 and len(value) == 21 and value[0] == 4:   # issuer fingerprint
                          ids.append(value[-8:].hex().upper())
                  areas.append(ids)
              return areas[0], areas[1]


          def openpgp_issuers(armored):
              """(hashed, unhashed) issuer key IDs of the one v4 signature packet in an
              armored OpenPGP signature, or None if it is anything else."""
              match = ARMOR.match(armored.replace("\r\n", "\n").strip())
              if not match:
                  return None
              try:
                  data = base64.b64decode(match.group(1), validate=False)
                  first = data[0]
                  if not first & 0x80:
                      return None
                  if first & 0x40:                      # new-format packet header
                      tag, octet = first & 0x3F, data[1]
                      if octet < 192:
                          start, length = 2, octet
                      elif octet < 224:
                          start, length = 3, ((octet - 192) << 8) + data[2] + 192
                      elif octet == 255:
                          start, length = 6, int.from_bytes(data[2:6], "big")
                      else:
                          return None
                  else:                                 # old-format packet header
                      tag, kind = (first >> 2) & 0x0F, first & 3
                      if kind == 3:
                          return None
                      size = 1 << kind
                      start, length = 1 + size, int.from_bytes(data[1:1 + size], "big")
                  body = data[start:start + length]
                  if tag != 2 or len(body) != length or start + length != len(data) or not body or body[0] != 4:
                      return None
                  return subpacket_issuers(body, 4)
              except (IndexError, ValueError, binascii.Error):
                  return None


          def signer_problem(commit, keys_of):
              """Why this commit is not signed by a person, or None if it is: verified by
              GitHub, with one OpenPGP signature from a key its committer registered."""
              inner = commit.get("commit")
              verification = inner.get("verification") if isinstance(inner, dict) else None
              if not isinstance(verification, dict) or not isinstance(verification.get("verified"), bool):
                  raise Unknown("GitHub's answer has no signature verification for the commit")
              if not verification["verified"] or verification.get("reason") != "valid":
                  return f"it has no verified signature (GitHub says: {verification.get('reason') or 'not verified'})"
              committer = commit.get("committer") if isinstance(commit.get("committer"), dict) else {}
              git_committer = inner.get("committer") if isinstance(inner.get("committer"), dict) else {}
              login, email = committer.get("login"), git_committer.get("email")
              signature = verification.get("signature")
              signature = signature.strip() if isinstance(signature, str) else ""
              by_github = "GitHub signed it, not a person (a web edit, an \"Update branch\" merge, or a bot)"
              if login == "web-flow" or email == "noreply@github.com":
                  return by_github
              if signature.startswith("-----BEGIN SSH SIGNATURE-----"):
                  return "it is signed with an SSH key, and commits here are signed with an OpenPGP key"
              if signature.startswith("-----BEGIN SIGNED MESSAGE-----"):
                  return "it is signed with an S/MIME certificate, and commits here are signed with an OpenPGP key"
              issuers = openpgp_issuers(signature)
              if issuers is None:
                  return "its signature could not be read as one OpenPGP signature"
              signed_over, loose = issuers
              if GITHUB_KEY_IDS.intersection(signed_over + loose):
                  return by_github
              if not signed_over or set(loose) - set(signed_over):
                  # Only an issuer the signature covers says who signed. One named beside it,
                  # or instead of it, could have been added by anyone.
                  return "its signature doesn't name its key in the part it signs, or names another key outside it"
              if committer.get("type") != "User" or not isinstance(login, str) or not LOGIN.fullmatch(login):
                  return "GitHub names no user account as its committer, so the signing key is nobody's"
              if not set(signed_over) <= keys_of(login):     # every issuer it names, not just one of them
                  return f"its signature is not from an OpenPGP key that {login} has on GitHub"
              return None


          def merges_as_is(head_ref, patterns):
              """Whether a branch name matches one of the patterns, one path segment at a
              time: a `*` never crosses a `/`, and `**` means nothing more than `*`."""
              parts = head_ref.split("/")
              for pattern in patterns:
                  wanted = pattern.split("/")
                  if len(wanted) == len(parts) and all(fnmatch.fnmatchcase(part, want) for part, want in zip(parts, wanted)):
                      return True
              return False


          def judge(pr, commits, as_is_heads, event_head, keys_of):
              """A sentence saying why the pull request may land. Raises NotReady or Unknown."""
              try:
                  head, base = pr["head"], pr["base"]
                  head_ref, head_sha, count = head["ref"], head["sha"], pr["commits"]
                  same_repo = (head.get("repo") or {}).get("full_name") == base["repo"]["full_name"]
              except (KeyError, TypeError) as exc:
                  raise Unknown(f"GitHub's answer for the pull request is missing {exc}") from exc
              if not isinstance(head_ref, str) or not isinstance(head_sha, str) or type(count) is not int:
                  raise Unknown("GitHub's answer for the pull request has an unexpected shape")
              if head_sha != event_head:
                  # This run reports on the commit that started it. Judging a newer head here
                  # would put that head's verdict on the older commit.
                  raise Behind(f"GitHub reports {head_sha[:12]} as the pull request's head, and this run is for "
                               f"{event_head[:12]}. If the pull request has moved on, the run for its new head decides. "
                               "If not, re-run this check")
              if same_repo and merges_as_is(head_ref, as_is_heads):
                  return (f"`{head_ref}` is a branch that merges as it is, so this check doesn't judge its {count} "
                          "commit(s). GitHub's signature rule still requires each of them to be verified.")
              if count != 1:
                  listed = ([commit.get("sha") for commit in commits]
                            if isinstance(commits, list) and all(isinstance(commit, dict) for commit in commits) else None)
                  if listed is not None and len(listed) < LISTED and head_sha not in listed:
                      # The whole list, without this head: it is from before the push, and the count may be too.
                      raise Behind("GitHub's list of the pull request's commits doesn't show its head yet. Re-run this check")
                  if listed == [head_sha]:
                      # The list says one commit and the count doesn't: one of them hasn't caught up with the push.
                      raise Behind("GitHub's count of the pull request's commits doesn't match its list yet. Re-run this check")
                  raise NotReady(f"It has {count} commits, and it lands as one. {HOW}")
              if not isinstance(commits, list) or not all(isinstance(commit, dict) for commit in commits):
                  raise Unknown("GitHub's list of the pull request's commits has an unexpected shape")
              if len(commits) != 1:
                  # The pull request says one commit. Right after a squash is pushed, the list can
                  # still hold the commits from before it.
                  raise Behind("GitHub's list of the pull request's commits doesn't match its count of one yet. "
                               "Re-run this check")
              commit = commits[0]
              if commit.get("sha") != head_sha:
                  raise Behind("GitHub's list of the pull request's commits doesn't show its head yet. Re-run this check")
              parents = commit.get("parents")
              if not isinstance(parents, list):
                  raise Unknown("GitHub's answer has no parents for the commit")
              if len(parents) != 1:
                  raise NotReady(f"Its commit {head_sha[:12]} is a merge commit. {HOW}")
              problem = signer_problem(commit, keys_of)
              if problem:
                  raise NotReady(f"Its commit {head_sha[:12]} can't land: {problem}. {HOW}")
              return f"One commit, {head_sha[:12]}, signed by a person."


          def judge_all(pr, commits, others, as_is_heads, event_head, keys_of, event_state="", event_draft=""):
              """judge() for this pull request, then for every other open pull request with the
              same head commit (`others`: their (pull request, commits) answers). The result is a
              check on the commit, and a ruleset matches it by name alone: a pass earned against
              one base must not let the same commit land on another, where it could be several
              commits. So the commit passes only if every open pull request it heads may land.

              Two kinds of pull request can't merge as they are, and their run reports for the
              others instead of failing them: a closed one, and a draft that shares its commit
              with a pull request that isn't a draft. Both are taken as such only when the event
              and GitHub's answer agree. A draft alone is judged as ever."""
              answered = pr if isinstance(pr, dict) else {}
              if event_state == "closed" and answered.get("state") == "closed":
                  verdict = "This pull request is closed, and every open pull request with this head commit may land."
              elif event_draft == "true" and answered.get("draft") is True and others:
                  verdict = "This pull request is a draft, and every other open pull request with this head commit may land."
              else:
                  verdict = judge(pr, commits, as_is_heads, event_head, keys_of)
              for other, other_commits in others:
                  try:
                      judge(other, other_commits, as_is_heads, event_head, keys_of)
                  except NotReady as exc:
                      number = other.get("number") if isinstance(other, dict) else None
                      raise NotReady(f"Pull request #{number} has the same head commit and can't land. {exc} This check "
                                     "belongs to the commit, so it fails for every pull request the commit heads: make "
                                     "that pull request ready too, or close it, then re-run this check") from exc
              return verdict


          def fetch(path, token, deadline):
              """A GitHub API answer as JSON. Raises Unknown when none arrives in time."""
              api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              last, attempts = "no attempt was made", 4
              for attempt in range(attempts):
                  left = deadline - time.monotonic()
                  if left <= 1:
                      break
                  wait = 2 * (attempt + 1)
                  request = urllib.request.Request(api + path, headers={
                      "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "signed-landing"})
                  try:
                      with urllib.request.urlopen(request, timeout=min(30, left)) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      last = f"HTTP {exc.code}"
                      retry_after = (exc.headers.get("Retry-After") or "") if exc.headers else ""
                      if exc.code in (403, 429) and retry_after.isdigit():      # a rate limit says how long to wait
                          wait = int(retry_after) + 1
                      elif exc.code not in (429, 500, 502, 503, 504):
                          break
                  except (OSError, http.client.HTTPException, ValueError) as exc:
                      last = str(exc) or type(exc).__name__
                  if attempt + 1 < attempts:
                      time.sleep(max(0, min(wait, deadline - time.monotonic() - 1)))
              raise Unknown(f"GitHub did not answer for {path} ({last}). Re-run this check")


          def committer_keys(login, token, deadline):
              """The IDs of the OpenPGP keys and subkeys a user has on GitHub."""
              keys = fetch(f"/users/{login}/gpg_keys?per_page=100", token, deadline)
              if not isinstance(keys, list):
                  raise Unknown(f"GitHub's list of {login}'s OpenPGP keys has an unexpected shape")
              ids = set()
              for key in keys:
                  if not isinstance(key, dict) or key.get("revoked") is True:      # a revoked key takes its subkeys with it
                      continue
                  entries = [key] + list(key.get("subkeys") or [])
                  ids.update(e["key_id"].upper() for e in entries
                             if isinstance(e, dict) and isinstance(e.get("key_id"), str)
                             and e.get("revoked") is not True and e.get("can_sign") is not False)
              return ids


          def open_heads(repo, sha, token, deadline):
              """The numbers of the open pull requests whose head is this commit, whatever
              branch or repository they come from, with pages read. Drafts are left out: a
              draft can't merge, and it is judged by its own run when it is marked ready."""
              numbers = []
              for page in range(1, PAGES + 1):
                  found = fetch(f"/repos/{repo}/pulls?state=open&per_page={LISTED}&page={page}", token, deadline)
                  if not isinstance(found, list) or not all(isinstance(other, dict) for other in found):
                      raise Unknown("GitHub's list of the open pull requests has an unexpected shape")
                  for other in found:
                      other_head = other.get("head")
                      if not isinstance(other_head, dict) or type(other.get("number")) is not int:
                          raise Unknown("GitHub's list of the open pull requests has an unexpected shape")
                      if other_head.get("sha") == sha and other.get("draft") is not True:
                          numbers.append(other["number"])
                  if len(found) < LISTED:
                      return numbers, page
              raise Unknown("this repository has too many open pull requests to check them all")


          def siblings(repo, number, sha, token, deadline):
              """The other open pull requests that head the commit this run reports on."""
              numbers, pages = open_heads(repo, sha, token, deadline)
              if pages > 1 and open_heads(repo, sha, token, deadline)[0] != numbers:
                  # Pages are read by position: one that closed between two reads can hide another.
                  raise Behind("GitHub's list of the open pull requests changed while it was read. Re-run this check")
              return [other for other in numbers if other != number]


          def main():
              repo, number, token, event_head = (os.environ.get(name, "") for name in ("REPO", "PR", "GH_TOKEN", "HEAD_SHA"))
              if (not re.fullmatch(r"[\w.-]+/[\w.-]+", repo) or not re.fullmatch(r"[1-9]\d*", number) or not token
                      or not re.fullmatch(r"[0-9a-f]{40}", event_head)):
                  print("::error title=signed-landing::REPO, PR, HEAD_SHA and GH_TOKEN must be set by the workflow")
                  return 1
              as_is_heads = os.environ.get("AS_IS_HEADS", "").split()
              event_state, event_draft = os.environ.get("EVENT_STATE", ""), os.environ.get("EVENT_DRAFT", "")
              deadline = time.monotonic() + 120
              known = {}

              def keys_of(login):                       # one read for each committer, however many pull requests are judged
                  if login not in known:
                      known[login] = committer_keys(login, token, deadline)
                  return known[login]

              try:
                  while True:
                      pr = fetch(f"/repos/{repo}/pulls/{number}", token, deadline)
                      commits = fetch(f"/repos/{repo}/pulls/{number}/commits?per_page={LISTED}", token, deadline)
                      try:
                          others = [(fetch(f"/repos/{repo}/pulls/{other}", token, deadline),
                                     fetch(f"/repos/{repo}/pulls/{other}/commits?per_page={LISTED}", token, deadline))
                                    for other in siblings(repo, int(number), event_head, token, deadline)]
                          print(judge_all(pr, commits, others, as_is_heads, event_head, keys_of, event_state, event_draft))
                          return 0
                      except Behind:
                          # This is the only run for this commit, so give GitHub's reads time to catch up
                          # with the push before reporting: half the deadline, asking every five seconds.
                          if deadline - time.monotonic() < 65:
                              raise
                          time.sleep(5)
              except NotReady as exc:
                  print(f"::error title=Not ready to land::{exc}")
              except Unknown as exc:
                  print(f"::error title=Could not check this pull request::{exc}.")
              except Exception as exc:                  # never pass, and never fail without saying why
                  print(f"::error title=Could not check this pull request::{type(exc).__name__}: {exc}. Re-run this check.")
              return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY
