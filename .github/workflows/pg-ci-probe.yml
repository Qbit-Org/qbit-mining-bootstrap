name: PRISM PostgreSQL CI probe (temporary)

# Temporary diagnostic for the PostgreSQL shard statement timeouts. Runs the
# prism-native-postgres shards under three set-ups and records slow statements,
# CPU, I/O and memory. Removed before the branch merges.
on:
  push:
    branches:
      - ci/pg-contract-statement-timeouts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prism-native-postgres:
    name: probe ${{ matrix.variant }} (shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, tmpfs, cpu4]
        shard: [0, 1, 2, 3]
        include:
          - variant: baseline
            runner: blacksmith-2vcpu-ubuntu-2404
            pg_options: ""
          - variant: tmpfs
            runner: blacksmith-2vcpu-ubuntu-2404
            pg_options: "--tmpfs /var/lib/postgresql/data:rw --shm-size=1g"
          - variant: cpu4
            runner: blacksmith-4vcpu-ubuntu-2404
            pg_options: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prism_test
          POSTGRES_USER: prism_test
          POSTGRES_PASSWORD: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prism_test -d prism_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
          ${{ matrix.pg_options }}
    env:
      PRISM_TEST_DATABASE_URL: postgresql://prism_test:prism_test@127.0.0.1:5432/prism_test
      PRISM_TEST_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      PRISM_TEST_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Name the gate manifest and the test log
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          printf 'PRISM_TEST_GATE_MANIFEST=%s/prism-gate-manifest-%s.txt\n' "${RUNNER_TEMP}" "${SHARD_INDEX}" >> "${GITHUB_ENV}"
          printf 'PRISM_TEST_LOG=%s/prism-native-tests-%s.log\n' "${RUNNER_TEMP}" "${SHARD_INDEX}" >> "${GITHUB_ENV}"
          printf 'PROBE_DIR=%s/probe\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
      - name: Install tools for disposable primary and standby failover test
        uses: ./.github/actions/apt-install
        with:
          packages: postgresql-16
      - name: Restore the pinned qbit release from the cache
        id: prism-qbit-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/prism-qbit
          key: prism-qbit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-prism-qbit.sh') }}
      - name: Install pinned qbit for native mining and CTV integration
        run: |
          set -euo pipefail
          PRISM_QBIT_CACHE_DIR="${HOME}/.cache/prism-qbit" \
            bash .github/scripts/install-prism-qbit.sh "${RUNNER_TEMP}/prism-qbit"
      - name: Start the probe
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p "${PROBE_DIR}"
          {
            echo "== runner"; nproc; free -m; df -h / /dev/shm "${RUNNER_TEMP}"; lscpu | head -20
            echo "== container mounts"; docker inspect --format '{{json .HostConfig.Tmpfs}} shm={{.HostConfig.ShmSize}}' "${PG_CONTAINER}"
            docker exec "${PG_CONTAINER}" df -h /var/lib/postgresql/data /dev/shm
          } | tee "${PROBE_DIR}/runner.txt"
          psql "${PRISM_TEST_DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          LOAD 'auto_explain';
          ALTER SYSTEM SET log_min_duration_statement = '1s';
          ALTER SYSTEM SET log_parameter_max_length = 64;
          ALTER SYSTEM SET log_lock_waits = on;
          ALTER SYSTEM SET log_autovacuum_min_duration = '1s';
          ALTER SYSTEM SET log_temp_files = '10MB';
          ALTER SYSTEM SET log_line_prefix = '%m [%p] %a ';
          ALTER SYSTEM SET track_io_timing = on;
          ALTER SYSTEM SET session_preload_libraries = 'auto_explain';
          ALTER SYSTEM SET auto_explain.log_min_duration = '3s';
          ALTER SYSTEM SET auto_explain.log_nested_statements = on;
          SELECT pg_reload_conf();
          SQL
          cat /proc/stat | head -1 > "${PROBE_DIR}/stat.start"
          cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory > "${PROBE_DIR}/pressure.start" 2>/dev/null || true
          nohup vmstat -n -t 5 > "${PROBE_DIR}/vmstat.log" 2>&1 &
          nohup bash -c 'while sleep 15; do date -u +%T; docker stats --no-stream --format "{{.Name}} {{.CPUPerc}} {{.MemUsage}}" ; free -m | sed -n 2p; df -m / | tail -1; done' > "${PROBE_DIR}/stats.log" 2>&1 &
      - name: Run workspace test shard in required integration mode
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          set -euo pipefail
          python3 scripts/run_rust_test_shard.py \
            --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" \
            2>&1 | tee "${PRISM_TEST_LOG}"
      - name: Summarise the probe
        if: ${{ !cancelled() }}
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          VARIANT: ${{ matrix.variant }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          cat /proc/stat | head -1 > "${PROBE_DIR}/stat.end"
          cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory > "${PROBE_DIR}/pressure.end" 2>/dev/null || true
          docker logs "${PG_CONTAINER}" > "${PROBE_DIR}/postgres.log" 2>&1
          {
            echo "== variant ${VARIANT} shard ${SHARD_INDEX}"
            echo "== cpu (jiffies: user nice system idle iowait irq softirq steal)"
            cat "${PROBE_DIR}/stat.start" "${PROBE_DIR}/stat.end"
            python3 - "${PROBE_DIR}" <<'PY'
          import sys
          d = sys.argv[1]
          a = [int(x) for x in open(f"{d}/stat.start").read().split()[1:9]]
          b = [int(x) for x in open(f"{d}/stat.end").read().split()[1:9]]
          delta = [y - x for x, y in zip(a, b)]
          total = sum(delta) or 1
          names = ["user", "nice", "system", "idle", "iowait", "irq", "softirq", "steal"]
          print(" ".join(f"{n}={100*v/total:.1f}%" for n, v in zip(names, delta)))
          PY
            echo "== pressure start/end"; cat "${PROBE_DIR}/pressure.start" "${PROBE_DIR}/pressure.end" 2>/dev/null
            echo "== docker-proxy cpu"; ps -o pid,cputime,args -C docker-proxy || true
            echo "== postgres container cgroup cpu"
            for f in $(find /sys/fs/cgroup -maxdepth 4 -path "*${PG_CONTAINER}*" -name cpu.stat 2>/dev/null); do echo "$f"; cat "$f"; done
            echo "== memory"; free -m
            echo "== database sizes"
            psql "${PRISM_TEST_DATABASE_URL}" -Atc "SELECT datname, pg_size_pretty(pg_database_size(datname)) FROM pg_database ORDER BY 1"
            docker exec "${PG_CONTAINER}" du -sh /var/lib/postgresql/data /var/lib/postgresql/data/pg_wal
            psql "${PRISM_TEST_DATABASE_URL}" -Atc "SELECT count(*) AS schemas FROM pg_namespace" -c "SELECT count(*) AS classes FROM pg_class" -c "SELECT count(*) AS constraints FROM pg_constraint" -c "SELECT relname, n_live_tup, n_dead_tup, last_autovacuum FROM pg_stat_sys_tables WHERE relname IN ('pg_class','pg_constraint','pg_attribute','pg_index','pg_depend','pg_type') ORDER BY 1"
            psql "${PRISM_TEST_DATABASE_URL}" -c "SELECT * FROM pg_stat_bgwriter" -c "SELECT * FROM pg_stat_wal" -c "SELECT datname, xact_commit, blks_read, blks_hit, temp_bytes, deadlocks, blk_read_time, blk_write_time FROM pg_stat_database WHERE datname IS NOT NULL"
            echo "== statements over 1 s, slowest first"
            grep -E 'duration: [0-9.]+ ms' "${PROBE_DIR}/postgres.log" | sed -E 's/.*duration: ([0-9.]+) ms(.*)/\1\t\2/' | sort -rn -k1,1 | head -60 | cut -c 1-400
            echo "== count of statements over 1 s / 5 s / 10 s"
            grep -oE 'duration: [0-9.]+ ms' "${PROBE_DIR}/postgres.log" | awk '{d=$2/1000; if (d>=1) a++; if (d>=5) b++; if (d>=10) c++} END {print a+0, b+0, c+0}'
            echo "== errors"
            grep -E 'ERROR|FATAL|PANIC' "${PROBE_DIR}/postgres.log" | grep -v 'terminating connection due to administrator command' | sed -E 's/^[0-9-]+ [0-9:.]+ UTC \[[0-9]+\] //' | cut -c 1-200 | sort | uniq -c | sort -rn | head -40
          } 2>&1 | tee "${PROBE_DIR}/summary.txt"
      - name: Upload the probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pg-probe-${{ matrix.variant }}-${{ matrix.shard }}
          overwrite: true
          path: |
            ${{ env.PROBE_DIR }}
            ${{ env.PRISM_TEST_LOG }}
          if-no-files-found: warn
