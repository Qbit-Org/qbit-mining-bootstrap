# cargo-deny configuration. CI runs `cargo deny --locked check` with the
# version that .github/scripts/install-pinned-tool.sh pins; run the same
# locally with `cargo deny --locked check` once cargo-deny is on PATH.
#
# Every ignore below names its reason. Add to a list only with one.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec advisories: any vulnerability, unmaintained crate, or yanked
# version in the workspace's dependency graph (all features) fails the
# check, except the advisories ignored below, each with its reason. An
# ignore that no longer matches any crate fails the check too, so it is
# removed with the crate. (The fuzz workspace's own lock file,
# crates/qbit-prism-server/fuzz/Cargo.lock, is not checked.)
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # The advisory reports no vulnerability. qbit-prism-server,
    # qbit-prism-load and qbit-prism-dual-sim use chrono directly; the
    # vendored sqlx-core and crates.io sqlx-postgres use it through sqlx's
    # `chrono` feature. Replacing it is too large for a patch release. The PR
    # that removes chrono from the graph (#878) deletes this entry.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no patched version; replacement tracked in Qbit-Org/qbit-mining-bootstrap#878" },
]

[licenses]
# Every crate in the graph must carry one of these licenses. The list is what
# the workspace's dependency tree actually uses; extend it with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots ships Mozilla's CA certificate bundle as data under the
    # Community Data License Agreement (permissive); it reaches the graph
    # through rustls in reqwest and sqlx.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Duplicate versions of one crate are reported but do not fail the check;
# the workspace does not yet hold its tree to one version per crate.
multiple-versions = "warn"
# A dependency with no version requirement is refused, except the workspace's
# own path dependencies, which Cargo resolves to the one local copy.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io. A git or alternative-registry dependency needs a reason
# and an entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
