services:
  qbitd:
    image: ${QBITD_IMAGE:-invalid.invalid/qbit-mining-bootstrap/qbitd:production-image-not-configured}
    pull_policy: always
    volumes:
      - type: bind
        source: ${QBIT_DATA_SOURCE:-/production-source-not-configured/qbit}
        target: /var/lib/qbit
        bind:
          create_host_path: false

  ckpool:
    image: ${CKPOOL_IMAGE:-invalid.invalid/qbit-mining-bootstrap/ckpool:production-image-not-configured}
    pull_policy: always
    restart: unless-stopped
    volumes: !override []

  bitcoind:
    image: ${BITCOIND_IMAGE:-invalid.invalid/qbit-mining-bootstrap/bitcoind:production-image-not-configured}
    pull_policy: always
    volumes:
      - type: bind
        source: ${BITCOIN_DATA_SOURCE:-/production-source-not-configured/bitcoin}
        target: /var/lib/bitcoin
        bind:
          create_host_path: false

  auxpow-coordinator:
    image: ${AUXPOW_COORDINATOR_IMAGE:-invalid.invalid/qbit-mining-bootstrap/auxpow:production-image-not-configured}
    pull_policy: always
    profiles: !override ["production-disabled"]

  auxpow-bridge:
    image: ${AUXPOW_COORDINATOR_IMAGE:-invalid.invalid/qbit-mining-bootstrap/auxpow:production-image-not-configured}
    pull_policy: always
    profiles: !override ["production-disabled"]

  auxpow-stratum:
    image: ${AUXPOW_COORDINATOR_IMAGE:-invalid.invalid/qbit-mining-bootstrap/auxpow:production-image-not-configured}
    pull_policy: always
    restart: unless-stopped

  prism-postgres:
    image: ${PRISM_POSTGRES_IMAGE:-invalid.invalid/qbit-mining-bootstrap/postgres:production-image-not-configured}
    pull_policy: always
    volumes:
      - type: bind
        source: ${PRISM_POSTGRES_DATA_SOURCE:-/production-source-not-configured/postgres/data}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ${PRISM_POSTGRES_WAL_SOURCE:-/production-source-not-configured/postgres/wal}
        target: /var/lib/postgresql/wal
        bind:
          create_host_path: false

  # Signing seeds reach each mining frontend only as files in an operator-owned,
  # read-only secrets directory (#260 D4); the direct seed variables are cleared
  # so a stale .env value cannot win. The image runs as UID/GID 10001, which
  # must be able to read both seed files. docs/mainnet-deployment.md covers
  # provisioning.
  prism-coordinator: &prism-coordinator-production
    image: ${PRISM_COORDINATOR_IMAGE:-invalid.invalid/qbit-mining-bootstrap/prism:production-image-not-configured}
    pull_policy: always
    restart: unless-stopped
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      PRISM_MANIFEST_SIGNING_SEED_HEX: ""
      PRISM_LEDGER_ATTESTATION_SIGNING_SEED_HEX: ""
      PRISM_ALLOW_TEST_SIGNING_SEEDS: "0"
      PRISM_MANIFEST_SIGNING_SEED_HEX_FILE: /run/secrets/qbit-prism/manifest-signing-seed-hex
      PRISM_LEDGER_ATTESTATION_SIGNING_SEED_HEX_FILE: /run/secrets/qbit-prism/ledger-attestation-signing-seed-hex
    volumes:
      - type: bind
        source: ${PRISM_AUDIT_DATA_SOURCE:-/production-source-not-configured/prism/audit}
        target: ${PRISM_AUDIT_DIR:-/var/lib/qbit-prism/audit}
        bind:
          create_host_path: false
      - type: bind
        source: ${PRISM_SECRETS_SOURCE:-/production-source-not-configured/prism/secrets}
        target: /run/secrets/qbit-prism
        read_only: true
        bind:
          create_host_path: false

  prism-coordinator-2:
    <<: *prism-coordinator-production

  # The standby the public read tier serves from. Its data directory is cloned
  # by pg_basebackup rather than initdb, so it takes no WAL bind of its own --
  # the base backup lays the cluster down under this one source. Provisioning,
  # slot management and the WAL-retention risk: docs/prism-postgres-replica.md.
  prism-postgres-replica:
    image: ${PRISM_POSTGRES_IMAGE:-invalid.invalid/qbit-mining-bootstrap/postgres:production-image-not-configured}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${PRISM_POSTGRES_REPLICA_DATA_SOURCE:-/production-source-not-configured/postgres-replica/data}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  # The public process serves canonical audit bytes from PostgreSQL. It is
  # seedless: it receives neither the secrets mount nor any signing variable.
  prism-public-api:
    image: ${PRISM_COORDINATOR_IMAGE:-invalid.invalid/qbit-mining-bootstrap/prism:production-image-not-configured}
    pull_policy: always
    restart: unless-stopped
    ulimits:
      core:
        soft: 0
        hard: 0

  permissionless-miner:
    profiles: !override ["production-disabled"]

  real-miner:
    profiles: !override ["production-disabled"]

  auxpow-real-miner:
    profiles: !override ["production-disabled"]
