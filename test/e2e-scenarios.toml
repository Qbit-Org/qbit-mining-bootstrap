  "qbit-prism-server::compact_runtime_e2e::real_socket_reconnect_resumes_original_entropy_mask_and_submits_once",
  "qbit-prism-server::compact_runtime_e2e::refresh_issue_resume_preserves_original_work_and_compact_storage",
  "qbit-prism-server::ledger_postgres::global_duplicates_idempotence_and_config_fencing",
]
unit_tests = ["crates/qbit-prism-server/tests/stratum_protocol.rs::reconnect_on_another_listener_preserves_original_entropy_mask_and_expiry"]
lane_checks = ["cross-frontend-resume"]
notes = "L6 runs #281's Compose exercise of this criterion on the shipped images and the HA overlay: work issued by frontend 1 is accepted once on frontend 2, another worker's submission and a replay on either frontend are refused, and the ledger credits it once."

