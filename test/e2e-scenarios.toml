[[scenario]]
id = "malformed-frames-and-admission-limits"
title = "Malformed and oversized frames, and the admission limits"
owner = "#468"
lanes = ["pr"]
criteria = "Oversized frames close the connection; malformed frames, authorize cycling and unknown-job misses are charged to per-session budgets that disconnect; the per-source cap refuses at accept without backend work; a disconnect releases every permit; recommended budgets admit honest traffic; invalid settings are refused by name."
