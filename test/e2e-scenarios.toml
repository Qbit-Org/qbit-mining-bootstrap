# End-to-end and load scenario manifest (#543, #487 S14).
#
# Every end-to-end and load scenario we care about before production, with the
# lane that runs it, the issue that owns it, what it must show to pass, and
# whether it runs today. scripts/check_e2e_scenarios.py holds this file to
# what the lanes actually run; its docstring has the rules. In short:
#
# - A scenario with `runs = true` cites its evidence, and the evidence decides
#   its lanes: `tests` are gated test ids (test/prism-gated-tests.txt runs in
#   `pr`, test/prism-nightly-gated-tests.txt in `nightly`,
#   test/prism-weekly-gated-tests.txt in `weekly`), `presets` are
#   crates/qbit-prism-load/presets (a nightly preset runs in `nightly`, a
#   weekly one in `weekly`, a manual one in `dispatch`, `smoke` in `pr`),
#   `unit_tests` are
#   `<file>::<fn>` ungated tests that `cargo test --workspace` runs in `pr`,
#   and `lane_checks` are the named checks of scripts/prism_shipped_image_lane.py,
#   which run in `L6`.
# - A scenario with `runs = false` cites no evidence and gives a `reason`; its
#   `owner` is the linked issue, and its `lanes` are the lanes it is planned
#   for (#487's definition of done: nothing unexercised without both).
# - Every live_regtest and load_smoke test in the PR gated list, every opt-in
#   nightly and weekly test, every preset and every L6 check must be cited by
#   a running scenario.
#
# Scenarios whose fixtures belong to #521 or #474 are listed under those
# issues; #487's lanes run them under load without redefining what they
# assert (#487's division of work).

schema = "qbit.e2e-scenarios.v1"

# ---------------------------------------------------------------------------
# Lanes. `pr`, `nightly`, `dispatch`, `weekly` and L6 run today; L2 to L5 are #487's
# lanes that do not exist yet, each owned by the sub-issue that builds it.
# ---------------------------------------------------------------------------

[lanes.pr]
title = "Every PR and push: the required ci.yml shards (#487 L0 and L1)"
runs = true
workflow = ".github/workflows/ci.yml"

[lanes.nightly]
title = "Nightly on 3.x.x: nightly presets and the opt-in live variants (#521 item 6)"
runs = true
workflow = ".github/workflows/prism-load-nightly.yml"

[lanes.dispatch]
title = "On demand only: the manual presets through workflow_dispatch"
runs = true
workflow = ".github/workflows/prism-load-nightly.yml"

[lanes.weekly]
title = "Weekly on 3.x.x: the long soak's weekly presets (#575 item 2) and the live-weekly job's opt-in live_regtest tests (#487 L4)"
runs = true
workflow = ".github/workflows/prism-load-nightly.yml"

[lanes.L2]
title = "Nightly load regression with repeats, a trend and a regression rule"
runs = false
owner = "#549"

[lanes.L3]
title = "Production-window matrix: full on the version bump, reduced weekly"
runs = false
owner = "#550"

[lanes.L4]
title = "Real-node scenarios under session load"
runs = false
owner = "#553"

[lanes.L5]
title = "Two-hour soak and chaos"
runs = false
owner = "#556"

[lanes.L6]
title = "Shipped images: the Compose prism profile with the HA overlay, weekly and on Dockerfile or Compose changes (#544)"
runs = true
workflow = ".github/workflows/prism-load-nightly.yml"

