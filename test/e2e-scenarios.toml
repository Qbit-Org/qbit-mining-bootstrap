[[scenario]]
id = "wallets-2000-cap"
title = "2,000 wallets at the production window on #521 scenario 7's fixture"
owner = "#553"
lanes = ["L4"]
criteria = "#521 scenario 7's assertions unchanged at 2,000 payees (two fanout chunks per block): attribution, coinbase, CTV outputs and carry-forward balances match an independent PPLNS recomputation, and the fanouts reach the wallets and are spent (decision 7)."
runs = false
reason = "Blocked by #604 and #622. In debug the fixture opens about 1,500 worker sessions per frontend one at a time, and at its 1 s reanchor each first job queues behind every connected session's same-tip rebuild, so some worker never gets work (#604). In release every session opens, and a later round's new tip reaches some worker late while the frontends defer job preparation on stale tip polling (#622). The live_regtest case wallets_2000_share_to_spend_starves_first_jobs_until_604_is_fixed reproduces #604 by hand."

[[scenario]]
id = "chain-events-under-load"
title = "#521 scenarios 1, 2, 4 and 5 at L4's session counts"
owner = "#553"
lanes = ["nightly", "weekly"]
criteria = "#521's assertions for each scenario, unchanged, under 2,000 share-only sessions at 100 shares/s; and the load's own: every acknowledged share durable and no refused share credited, no impossible refusal, and every session on a ready frontend given work on every tip that lasts 15 s within 15 s."
runs = true
tests = [
  "qbit-prism-server::live_regtest::chain_events_load_tests::nightly_deep_reorg_under_2000_sessions_keeps_balances_exact_and_serves_every_session",
  "qbit-prism-server::live_regtest::chain_events_load_tests::nightly_lost_race_under_2000_sessions_orphans_once_and_serves_every_session",
  "qbit-prism-server::live_regtest::chain_events_load_tests::nightly_node_killed_after_accepting_under_2000_sessions_reconciles_the_lost_block_once",
  "qbit-prism-server::live_regtest::chain_events_load_tests::weekly_dense_soak_under_2000_sessions_lands_every_block_and_holds_rss_flat",
  "qbit-prism-server::live_regtest::chain_events_load_tests::weekly_node_killed_before_submitblock_under_2000_sessions_lands_the_block_once",
  "qbit-prism-server::live_regtest::chain_events_load_tests::weekly_node_restarted_into_warmup_under_2000_sessions_lands_the_block_once",
  "qbit-prism-server::live_regtest::chain_events_load_tests::weekly_node_stopped_after_accepting_under_2000_sessions_lands_the_block_once",
  "qbit-prism-server::live_regtest::chain_events_load_tests::weekly_node_stopped_before_submitblock_under_2000_sessions_lands_the_block_once",
]
notes = "The frontends run #575's share-only settings and the production 60 s payout reanchor (scenario one-frontend-fast-reanchor runs the fixture's 1 s as #598's guard). Scenarios 1 and 2 and scenario 4's crash case run nightly; scenario 4's other four cases and scenario 5's 20-minute soak at 400 shares/s run weekly."

