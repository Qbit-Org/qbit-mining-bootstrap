# ---------------------------------------------------------------------------
# Faults under load (#554, #487 S16). The load harness's `faults` phase
# (crates/qbit-prism-load/src/fault/) injects each fault while the sessions
# keep mining, then holds it to the criteria below on top of the run's own
# contract: every acknowledged share in PostgreSQL, no committed share left
# unanswered mid-run, one submitblock per block hash. The criteria follow
# D3's async loss policy and #585's shutdown and lease behaviour.
# ---------------------------------------------------------------------------

[[scenario]]
id = "fault-sigterm-drain-offer-in-flight"
title = "SIGTERM of a frontend while a found block's submitblock is in flight"
owner = "#554"
lanes = ["nightly", "pr", "weekly"]
criteria = "The shutdown logs that it waits for the offer and no budget ALERT, the frontend exits 0 within 35 s, the block reaches the node exactly once, the node's accepted is recorded on the candidate before the process exits (#578, #585), and the frontend serves again after its relaunch; within 60 s of that the relaunch lands the block and every frontend serves work at the payout revision the landing committed, before the next fault starts (#686)."
runs = true
tests = ["qbit-prism-load::faults::faults_under_load_drain_an_offer_in_flight_and_outlast_a_settlement_lock_holder"]
presets = ["faults-long-real-node", "faults-pr-smoke", "faults-short-real-node"]
notes = "Per PR on the fake node with one frontend; nightly on the real node with two frontends and 500 sessions."

[[scenario]]
id = "fault-settlement-lock-holder"
title = "A long SETTLEMENT_LOCK holder while the sessions keep mining, with a tip minted during the hold"
owner = "#554"
lanes = ["nightly", "pr", "weekly"]
criteria = "The lock is taken only once every frontend serves work at the cluster's payout revision, waited for up to 60 s from the injection, so a block an earlier fault landed is republished first (#692); no share waits on the holder (answer p99 over the whole hold within --ack-p99-limit-ms); shares on retained work are accepted (at least 90%) until the refresh has been stalled for PRISM_SUBMIT_TIP_MAX_AGE_SECONDS, after which the server's refusals are counted; no session gets work on the new tip before the release, and every session has it within 10 s of the release. The share-ACK p50, p99 and max over the hold are recorded."
runs = true
tests = ["qbit-prism-load::faults::faults_under_load_drain_an_offer_in_flight_and_outlast_a_settlement_lock_holder"]
presets = ["faults-long-real-node", "faults-pr-smoke", "faults-short-real-node"]

