  "qbit-prism-server::stratum_admission_postgres::unknown_job_budget_bounds_ledger_queries_and_a_capped_source_runs_none",
  "qbit-prism-server::stratum_admission_postgres::wrap_exhaustion_leaves_subscription_retryable_and_disconnect_releases_guard",
]
unit_tests = [
  "crates/qbit-prism-server/tests/stratum_admission.rs::malformed_subscribe_does_not_allocate_then_pipelined_subscribes_reuse_identity",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::oversized_frames_close_connection_and_fragmented_json_survives_timer_ticks",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::malformed_frame_budget_counts_frames_not_bytes_and_then_disconnects",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::every_unknown_job_miss_is_requeried_and_charged_until_the_budget_disconnects",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::authorize_budget_bounds_username_cycling_and_keeps_reauthorization_working",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::per_source_cap_refuses_at_accept_without_backend_work_and_frees_the_slot_on_close",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::per_source_cap_of_zero_admits_every_connection_from_one_address",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::a_budget_disconnect_releases_the_global_per_source_and_per_username_permits",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::recommended_budgets_admit_a_thousand_valid_submits_and_an_honest_stale_burst",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::admission_settings_reject_malformed_and_out_of_range_values_by_name",
]

