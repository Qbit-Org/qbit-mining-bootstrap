  "qbit-prism-server::stratum_admission_postgres::unknown_job_budget_bounds_ledger_queries_and_a_capped_source_runs_none",
  "qbit-prism-server::stratum_admission_postgres::wrap_exhaustion_leaves_subscription_retryable_and_disconnect_releases_guard",
]
unit_tests = [
  "crates/qbit-prism-server/tests/stratum_admission.rs::malformed_subscribe_does_not_allocate_then_pipelined_subscribes_reuse_identity",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::oversized_frames_close_connection_and_fragmented_json_survives_timer_ticks",
  "crates/qbit-prism-server/tests/stratum_protocol.rs::malformed_frame_budget_counts_frames_not_bytes_and_then_disconnects",
