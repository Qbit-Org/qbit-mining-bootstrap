[[scenario]]
id = "soak-two-hours"
title = "Two hours at steady state with tips, own blocks and a fault every few minutes"
owner = "#556"
lanes = ["L5"]
criteria = "#291's criteria on #278's metric families: RSS bound, restart count, late wakes, lock-wait and ACK distributions, exact reconciliation."
runs = false
reason = "Needs S16's faults (#554); #521 scenario 5's 10-minute soak (r521-5-dense-cadence-soak) is its base."

[[scenario]]
id = "migration-lifecycle"
title = "A seeded 2.x.x-schema database migrated, mined on, reconciled and rolled back"
owner = "#545"
lanes = ["weekly"]
criteria = "Set by #545: the drained source's evidence and backup, an isolated restore reconciling exactly before any native acknowledgement, migrate and import-audits rehearsed then run for the cutover, both native servers landing their own blocks on the real node with the history untouched, and the post-ACK boundary of the migration guide's rollback section. #291's rehearsal stays the authority on production-sized data."
runs = true
tests = ["qbit-prism-server::live_regtest::migration_lifecycle_tests::weekly_2x_ledger_migrates_mines_reconciles_and_restores_in_isolation"]

[[scenario]]
id = "cutover-rehearsal"
title = "A mainnet-shaped 2.x.x ledger cut over as the migration guide runs it, measured"
owner = "#575"
lanes = ["pr", "weekly"]
criteria = "Recovery evidence, every 2.x.x table's counts and sums, every address's balances (SQL and the running API) and the payout window are unchanged; a frontend on the result is ready, issues a first job and passes self-check; each step's wall time and longest lock are reported."
runs = true
tests = [
  "qbit-prism-server::migration_rollback::cutover_rehearsal_tests::mainnet_shaped_2x_dump_rehearses_the_cutover_and_keeps_every_balance",
  "qbit-prism-server::live_regtest::migration_lifecycle_tests::weekly_mainnet_shaped_2x_ledger_cuts_over_measured_mines_and_restores_in_isolation",
]
notes = "The PR case rehearses a pg_dump of a PR-sized ledger. The weekly live_regtest variant cuts over 1x at 1/16 of the rows (about 4.1M) on a real regtest chain, at the server's default statement timeout, and `make prism-cutover-rehearsal` runs the same checks on an operator's snapshot."

[[scenario]]
id = "external-target-load-through-a-balancer"
title = "#291: the load harness's client driving frontends it did not launch, through a TCP balancer"
owner = "#291"
lanes = ["pr"]
criteria = "Two external-target client processes drive two in-repo frontends through a round-robin TCP balancer, one asking for its own share difficulty with d=, and each mines at the difficulty the frontend advertised. A frontend SIGKILLed and relaunched mid-run costs reconnects, not acknowledgements: every disconnected session reconnects, no share is refused as mined wrong, every acknowledged share id is committed, every committed id was acknowledged or went unanswered, and the two processes' stats merge into their sums."
runs = true
tests = ["qbit-prism-load::external_frontend::external_load_through_a_balancer_reaches_the_in_repo_frontends_and_reconciles"]
unit_tests = [
  "crates/qbit-prism-load/tests/external_target.rs::a_run_mines_the_advertised_difficulty_and_counts_what_the_target_did",
  "crates/qbit-prism-load/tests/external_target.rs::documents_from_two_processes_merge_into_their_sum",
  "crates/qbit-prism-load/tests/external_target.rs::without_the_guard_flag_nothing_is_sent",
]
notes = "The fixture for #291's failover drill, load-balancer exercise and soak, which run `qbit-prism-load external` against the deployed pair behind the operator's balancer; those runs, and their reconciliation against the promoted primary, stay #291's."

[[scenario]]
id = "shipped-image-lane"
title = "The Compose prism profile with the HA overlay under modest real-miner load"
owner = "#544"
lanes = ["L6"]
criteria = "Built by `docker compose build`, the stack runs both overlay frontends ready with distinct IDs that each one's self-check observes; cpuminer-opt on one frontend and qbit-prism-miner on the other each solve a block the node keeps, whose audit bundle both frontends serve identically and which verifies against the node's coinbase and the ledger key; each client's ledger rows equal the shares it saw acknowledged, with every submission answered; the public API lists the verified blocks; and #281 criterion 1 holds on the images."
runs = true
lane_checks = [
  "ha-frontends-ready",
  "cross-frontend-resume",
  "cpuminer-found-block",
  "prism-miner-found-block",
  "found-block-audit-verifies",
  "ledger-reconciles",
  "public-api-lists-found-blocks",
]
notes = "scripts/prism_shipped_image_lane.py; the report, client logs and Compose logs are the `prism-shipped-images` artifact."
