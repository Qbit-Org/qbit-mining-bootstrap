# PRISM primary client authentication (issue #145).
#
# Mounted read-only at /etc/postgresql/pg_hba.conf and selected through
# `postgres -c hba_file=...`, so it replaces the copy initdb leaves in PGDATA.
# It exists only to add the `replication` rules the prism-postgres-replica
# standby needs; every other rule reproduces the stock postgres image default
# so that nothing about the primary's reachability changes.
#
# Compose does not interpolate this file. The replication rules below name the
# default superuser `qbit` literally: a deployment that overrides
# PRISM_POSTGRES_USER must edit those two lines to match, or pg_basebackup from
# the replica fails with "no pg_hba.conf entry for replication connection".
# See docs/prism-postgres-replica.md.
#
# The first matching line wins, so order matters.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix socket. `trust` is what initdb writes by default; it keeps the image's
# initdb bootstrap, the compose healthcheck's pg_isready, and interactive
# `docker exec ... psql` working exactly as they did before this file existed.
local   all             all                                     trust

# Loopback TCP. The compose healthcheck connects to 127.0.0.1 with PGPASSWORD.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Ordinary client access from the compose network, i.e. the same reachability
# as the image's default `host all all all scram-sha-256`.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Physical replication for prism-postgres-replica (pg_basebackup and the
# standby's walreceiver). Edit the USER column when PRISM_POSTGRES_USER is not
# the default; production should use a dedicated REPLICATION role instead of
# the superuser (docs/prism-postgres-replica.md).
host    replication     qbit            0.0.0.0/0               scram-sha-256
host    replication     qbit            ::/0                    scram-sha-256
